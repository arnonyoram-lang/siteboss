<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a73e8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="דקה">
<title>דקה — יומן ומשימות שטח</title>
<link rel="manifest" href="manifest.json">
<style>
:root{--blue:#1c5fb0;--blue-d:#0f3d7a;--green:#1f9d57;--orange:#e67e22;--red:#e03131;--accent:#f6a609;--bg:#eef2f6;--card:#fff;--text:#1b2733;--sub:#67788a;--border:#d7dee6;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:'Segoe UI',Arial,Tahoma,sans-serif;background:#dfe5ea;color:var(--text);font-size:16px;-webkit-text-size-adjust:100%;}
body{display:flex;justify-content:center;}
#app{max-width:480px;width:100%;min-height:100vh;background:var(--bg);position:relative;box-shadow:0 0 40px rgba(0,0,0,.18);display:flex;flex-direction:column;overflow:hidden;}
.screen{display:none;flex-direction:column;flex:1;overflow:hidden;}
.screen.active{display:flex;}
.screen-body{flex:1;overflow-y:auto;padding:16px;padding-bottom:calc(90px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;}
.topbar{min-height:62px;background:linear-gradient(180deg,var(--blue),var(--blue-d));color:white;display:flex;align-items:center;padding:0 12px;gap:8px;flex-shrink:0;box-shadow:0 2px 10px rgba(15,61,122,.3);padding-top:env(safe-area-inset-top);position:relative;z-index:5;}
.topbar-center{flex:1;text-align:center;min-width:0;}
.topbar-title{font-size:18px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.3px;}
.topbar-sub{font-size:11px;opacity:.85;margin-top:1px;}
.icon-btn{width:44px;height:44px;border:none;background:rgba(255,255,255,.18);color:white;border-radius:12px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.icon-btn:active{background:rgba(255,255,255,.32);}
.back-btn{display:flex;align-items:center;gap:5px;height:44px;padding:0 16px;border:2px solid rgba(255,255,255,.6);background:rgba(255,255,255,.22);color:white;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer;flex-shrink:0;font-family:inherit;}
.back-btn:active{background:rgba(255,255,255,.4);}
#bottom-back{display:none;padding:6px 16px calc(14px + env(safe-area-inset-bottom));}
#bottom-back button{width:100%;min-height:50px;border:2px solid var(--blue);background:#eaf1fb;color:var(--blue-d);border-radius:14px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;}
#bottom-back button:active{background:#d9e6f7;}
#install-banner{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:linear-gradient(135deg,var(--blue),var(--blue-d));color:#fff;display:flex;align-items:center;gap:10px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -3px 16px rgba(0,0,0,.25);z-index:80;}
.install-step{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;}
.install-step b{background:var(--blue);color:#fff;min-width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.lang-toggle{display:flex;gap:3px;}
.lang-btn{padding:4px 9px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:transparent;color:rgba(255,255,255,.7);font-size:12px;font-weight:700;cursor:pointer;}
.lang-btn.active{background:white;color:var(--blue-d);}
.card{background:var(--card);border-radius:16px;border:1px solid #e8edf2;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(27,39,51,.06);}
.card-title{font-size:16px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:7px;}
input,textarea,select{width:100%;padding:14px 15px;border:2px solid var(--border);border-radius:12px;font-family:inherit;font-size:16px;color:var(--text);background:white;outline:none;}
input:focus,textarea:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(28,95,176,.12);}
textarea{resize:vertical;min-height:100px;line-height:1.6;}
label{display:block;font-size:14px;font-weight:700;color:var(--text);margin-bottom:6px;}
.form-group{margin-bottom:14px;}
.btn{min-height:56px;border:none;border-radius:14px;font-family:inherit;font-size:17px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:0 16px;position:relative;transition:opacity .15s,transform .1s;box-shadow:0 2px 6px rgba(27,39,51,.12);}
.btn::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;}
.btn:active{transform:scale(.97);}
.btn-blue{background:var(--blue);color:white;}
.btn-green{background:var(--green);color:white;}
.btn-red{background:var(--red);color:white;}
.btn-gray{background:var(--bg);color:var(--text);}
.btn-outline{background:white;border:2px solid var(--blue);color:var(--blue);}
.btn-sm{min-height:36px;font-size:13px;border-radius:9px;padding:0 12px;width:auto;}
.home-btn{border-radius:18px;padding:18px;text-align:right;border:none;cursor:pointer;display:flex;align-items:center;gap:15px;width:100%;margin-bottom:13px;color:white;position:relative;overflow:hidden;min-height:92px;box-shadow:0 4px 14px rgba(27,39,51,.18);}
.home-btn::before{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.14),transparent 55%);}
.home-btn:active{transform:scale(.98);}
.home-btn-icon{font-size:40px;flex-shrink:0;width:62px;height:62px;border-radius:16px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;}
.home-btn-texts{flex:1;min-width:0;}
.home-btn-title{font-size:20px;font-weight:900;display:block;margin-bottom:4px;}
.home-btn-desc{font-size:13px;opacity:.95;display:block;line-height:1.45;}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
.stat-card{background:var(--card);border:1px solid #e8edf2;border-radius:14px;padding:14px 8px;text-align:center;box-shadow:0 2px 6px rgba(27,39,51,.05);cursor:pointer;}
.stat-card:active{transform:scale(.97);}
.stat-num{font-size:30px;font-weight:900;color:var(--blue);line-height:1;}
#stat-defects{color:var(--orange);}#stat-safety{color:var(--green);}
.stat-label{font-size:12px;color:var(--sub);font-weight:700;margin-top:5px;}
.voice-btn{width:80px;height:80px;border-radius:50%;border:none;background:var(--green);color:white;font-size:34px;cursor:pointer;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;box-shadow:0 4px 15px rgba(39,174,96,.4);transition:all .2s;}
.voice-btn.recording{background:var(--red);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.workers-table{width:100%;border-collapse:collapse;font-size:14px;}
.workers-table th{background:var(--bg);padding:8px 10px;text-align:right;font-size:12px;font-weight:700;color:var(--sub);border-bottom:1px solid var(--border);}
.workers-table td{padding:6px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
.workers-table td input{padding:6px 8px;font-size:14px;text-align:center;min-height:36px;}
.workers-table tr.total-row td{font-weight:700;background:#f8fafc;}
.weather-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
.weather-btn{border:2px solid var(--border);border-radius:10px;padding:8px 4px;text-align:center;cursor:pointer;background:white;}
.weather-btn.active{border-color:var(--blue);background:#e8f0fe;}
.w-icon{font-size:22px;display:block;}
.w-label{font-size:10px;font-weight:600;color:var(--sub);margin-top:3px;display:block;}
.photos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.photo-thumb{aspect-ratio:1;border-radius:10px;overflow:hidden;position:relative;}
.photo-thumb img{width:100%;height:100%;object-fit:cover;}
.photo-add{border:2px dashed var(--border);border-radius:10px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:var(--bg);gap:4px;color:var(--sub);font-size:12px;font-weight:600;}
.photo-add-icon{font-size:28px;}
.photo-del{position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:rgba(231,76,60,.85);color:white;border:none;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.defect-card{border-radius:14px;border:1px solid var(--border);padding:14px;margin-bottom:10px;background:white;}
.sev-urgent{border-right:4px solid var(--red);}
.sev-normal{border-right:4px solid var(--orange);}
.sev-low{border-right:4px solid var(--green);}
.defect-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.defect-desc{font-size:15px;font-weight:700;flex:1;}
.sev-badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap;}
.sev-badge.urgent{background:#fdecea;color:var(--red);}
.sev-badge.normal{background:#fef3e7;color:var(--orange);}
.sev-badge.low{background:#eafaf1;color:var(--green);}
.defect-meta{font-size:12px;color:var(--sub);margin-bottom:10px;}
.defect-meta span{margin-left:10px;}
.defect-actions{display:flex;gap:6px;flex-wrap:wrap;}
.fix-panel{background:#eafaf1;border:1.5px solid #a9dfbf;border-radius:10px;padding:12px 14px;margin:10px 0 6px;}
.fix-panel-title{font-size:14px;font-weight:800;color:var(--green);margin-bottom:8px;}
.fix-row{display:flex;gap:8px;font-size:13px;margin-bottom:4px;align-items:flex-start;}
.fix-lbl{color:var(--sub);min-width:90px;flex-shrink:0;font-weight:600;}
.btn-fix-main{flex:1;padding:9px 12px;border-radius:8px;border:none;background:var(--green);color:white;font-size:14px;font-weight:800;cursor:pointer;min-width:120px;}
.btn-fix-main:active{opacity:.8;}
.photo-add-btn{display:flex;align-items:center;gap:8px;padding:12px 16px;border:2px dashed #bdc3c7;border-radius:10px;cursor:pointer;font-size:15px;color:var(--sub);background:#fafafa;}
.status-btn{padding:9px 14px;border-radius:10px;border:2px solid var(--border);background:white;font-size:14px;font-weight:700;cursor:pointer;}
.status-btn.active-open{background:#fdecea;border-color:var(--red);color:var(--red);}
.status-btn.active-progress{background:#fef3e7;border-color:var(--orange);color:var(--orange);}
.status-btn.active-done{background:#eafaf1;border-color:var(--green);color:var(--green);}
.filter-tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px;}
.filter-tab{padding:9px 16px;border-radius:22px;border:2px solid var(--border);background:white;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;color:var(--sub);}
.filter-tab.active{background:var(--blue);border-color:var(--blue);color:white;}
.work-type-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.work-type-btn{padding:14px;border-radius:12px;border:2px solid var(--border);background:white;text-align:center;cursor:pointer;}
.work-type-btn.active{border-color:var(--red);background:#fdf0ef;}
.work-type-icon{font-size:28px;display:block;margin-bottom:4px;}
.work-type-label{font-size:14px;font-weight:800;}
.work-type-count{display:block;font-size:11px;font-weight:700;color:var(--sub);margin-top:3px;}
.work-type-btn.active .work-type-count{color:var(--red);}
.stage-card{background:#f4f8fc;border:1px dashed #b9cce0;}
.stage-card-title{font-size:15px;font-weight:800;color:var(--blue-d);margin-bottom:3px;}
.stage-hint{font-size:12px;color:var(--sub);margin-bottom:12px;}
.stage-chips{display:flex;gap:8px;flex-wrap:wrap;}
.stage-chip{display:flex;align-items:center;gap:6px;padding:9px 13px;border-radius:22px;border:2px solid var(--border);background:white;font-size:14px;font-weight:700;cursor:pointer;color:var(--text);}
.stage-chip-i{font-size:18px;}
.stage-chip.on{border-color:var(--accent);background:#fff4d9;color:#7a5800;}
.fb-type{flex:1;text-align:center;padding:11px 6px;border:2px solid var(--border);border-radius:10px;background:white;font-size:14px;font-weight:700;cursor:pointer;color:var(--sub);}
.fb-type.active{border-color:var(--blue);background:#e8f0fe;color:var(--blue);}
.feat-toggle{display:flex;justify-content:space-between;align-items:center;padding:11px 4px;border-bottom:1px solid var(--border);font-size:15px;font-weight:600;}
.feat-toggle input{width:46px;height:26px;cursor:pointer;}
.faq-item{border-bottom:1px solid var(--border);padding:2px 0;}
.faq-q{padding:12px 4px;font-size:15px;font-weight:700;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center;}
.faq-q .arr{color:var(--sub);transition:transform .2s;flex-shrink:0;}
.faq-item.open .faq-q .arr{transform:rotate(90deg);}
.faq-a{font-size:14px;color:var(--sub);line-height:1.6;padding:0 4px 12px;display:none;}
.faq-item.open .faq-a{display:block;}
.stage-chip-x{background:var(--accent);color:#3d2c00;width:18px;height:18px;border-radius:50%;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;}
.safety-question.special{border-color:var(--accent);background:#fff8e8;}
.sq-special-tag{display:inline-block;background:var(--accent);color:#3d2c00;font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;margin-bottom:8px;}
.safety-question{background:white;border:1.5px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;}
.safety-question.passed{border-color:var(--green);background:#f0faf4;}
.safety-question.failed{border-color:var(--red);background:#fff5f5;}
.sq-text{font-size:14px;font-weight:600;margin-bottom:10px;line-height:1.5;}
.sq-alert{font-size:12px;color:var(--red);font-weight:700;margin-top:6px;display:none;}
.safety-question.failed .sq-alert{display:block;}
.sq-btns{display:flex;gap:10px;}
.sq-btn{flex:1;min-height:50px;border-radius:11px;border:2px solid var(--border);background:white;font-size:16px;font-weight:800;cursor:pointer;}
.sq-btn.ok{background:var(--green);border-color:var(--green);color:white;}
.sq-btn.fail{background:var(--red);border-color:var(--red);color:white;}
#sign-canvas,#jnl-sign-canvas,#sup-sign-canvas,#ob-sign-canvas,#perm-sign-canvas{border:2px solid var(--border);border-radius:12px;width:100%;height:110px;background:white;cursor:crosshair;touch-action:none;}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:#2c3e50;color:white;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:all .3s;pointer-events:none;z-index:9999;max-width:90%;text-align:center;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:flex-end;justify-content:center;}
.modal-overlay.hidden{display:none;}
.modal-sheet{background:white;border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding:20px;}
.modal-title{font-size:17px;font-weight:800;margin-bottom:16px;}
.modal-actions{display:flex;gap:10px;margin-top:16px;}
.history-item{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer;}
.history-item-date{font-size:15px;font-weight:700;}
.history-item-sub{font-size:12px;color:var(--sub);margin-top:3px;}
.report-container{padding:24px 22px;font-size:14px;line-height:1.7;color:#1b2733;background:#fff;}
.report-logo{text-align:center;margin-bottom:18px;padding-bottom:14px;border-bottom:3px solid var(--accent);}
.report-logo-title{font-size:28px;font-weight:900;color:var(--blue-d);letter-spacing:1.5px;}
.report-logo-sub{font-size:12px;color:var(--sub);margin-top:3px;}
.report-header{background:#f4f7fb;border:1px solid #e2e9f0;border-radius:10px;padding:14px 16px;margin-bottom:16px;}
.report-header p{margin-bottom:5px;font-size:13.5px;}
.report-header p:last-child{margin-bottom:0;}
.report-section-title{font-size:15px;font-weight:800;border-right:5px solid var(--blue);background:#eef3fa;padding:7px 12px;border-radius:7px;margin:18px 0 10px;color:var(--blue-d);}
.report-sq-row{display:flex;justify-content:space-between;align-items:center;padding:7px 4px;border-bottom:1px solid #eef1f5;font-size:13px;break-inside:avoid;}
.report-ok{color:var(--green);font-weight:700;}
.report-fail{color:var(--red);font-weight:700;}
.report-sign-box{border:2px solid var(--border);border-radius:10px;padding:10px;margin-top:8px;}
.report-footer{text-align:center;font-size:11px;color:var(--sub);margin-top:20px;padding-top:10px;border-top:1px solid var(--border);}
.offline-note{text-align:center;font-size:11px;color:var(--sub);padding:8px;border-top:1px solid var(--border);flex-shrink:0;}
.contractor-item{display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;}
.contractor-info .c-name{font-size:14px;font-weight:700;}
.contractor-info .c-meta{font-size:12px;color:var(--sub);}
.contractor-del{width:32px;height:32px;border-radius:8px;border:none;background:#fdecea;color:var(--red);font-size:16px;cursor:pointer;}
.fab{position:fixed;bottom:80px;left:16px;width:56px;height:56px;border-radius:50%;background:var(--blue);color:white;font-size:28px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 15px rgba(26,115,232,.4);z-index:100;}
/* REGISTRATION */
#s-register{overflow-y:auto;-webkit-overflow-scrolling:touch;}
.register-hero{background:linear-gradient(150deg,var(--blue-d) 0%,var(--blue) 100%);padding:36px 24px 44px;text-align:center;color:white;flex-shrink:0;}
.register-logo{font-size:42px;font-weight:900;letter-spacing:2px;margin-bottom:8px;}
.register-tagline{font-size:13px;opacity:.85;}
.register-body{background:white;border-radius:24px 24px 0 0;margin-top:-18px;padding:28px 20px 50px;}
.register-welcome{font-size:22px;font-weight:900;color:var(--text);margin-bottom:4px;}
.register-sub{font-size:14px;color:var(--sub);margin-bottom:24px;}
.reg-lang-row{display:flex;gap:10px;margin-top:4px;}
.reg-lang-btn{flex:1;padding:12px;border-radius:12px;border:2px solid #dce3e9;background:white;text-align:center;font-size:15px;font-weight:700;cursor:pointer;color:var(--sub);transition:all .2s;}
.reg-lang-btn.active{border-color:var(--blue);background:var(--blue-bg);color:var(--blue);}
.reg-submit{margin-top:8px;padding:16px;font-size:17px;letter-spacing:.5px;}
.reg-note{text-align:center;font-size:12px;color:var(--sub);margin-top:14px;opacity:.7;}
.btn-fix-sm{padding:5px 10px;border-radius:8px;border:none;background:#e67e22;color:white;font-size:12px;font-weight:700;cursor:pointer;margin-top:6px;}
.safety-fix-panel{background:#eafaf1;border:1.5px solid #a9dfbf;border-radius:10px;padding:10px 12px;margin-top:8px;}
.safety-fix-panel-title{font-size:13px;font-weight:800;color:var(--green);margin-bottom:6px;}
@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}
  .topbar,.offline-note,.no-print,#bottom-back{display:none!important;}
  .screen-body{padding:0!important;overflow:visible!important;}
  #app{box-shadow:none!important;max-width:100%!important;}
  .report-container{padding:0!important;}
  @page{margin:14mm;}
}
</style>
</head>
<body>
<div id="app">
<!-- HOME -->
<!-- REGISTRATION SCREEN -->
<div class="screen" id="s-register">
  <div class="register-hero">
    <div class="register-logo">דקה</div>
    <div class="register-tagline" data-t="appTagline"></div>
  </div>
  <div class="register-body">
    <div class="register-welcome" data-t="regWelcome"></div>
    <div class="register-sub" data-t="regSub"></div>

    <div class="form-group">
      <label class="form-label" data-t="regFullName"></label>
      <input id="reg-name" type="text" class="form-input" data-tp="regFullNamePh" autocomplete="name">
    </div>
    <div class="form-group">
      <label class="form-label" data-t="regPhone"></label>
      <input id="reg-phone" type="tel" class="form-input" placeholder="05X-XXXXXXX" autocomplete="tel">
    </div>
    <div class="form-group">
      <label class="form-label" data-t="regCompany"></label>
      <input id="reg-company" type="text" class="form-input" data-tp="regCompanyPh" autocomplete="organization">
    </div>
    <div class="form-group">
      <label class="form-label" data-t="regProject"></label>
      <input id="reg-project" type="text" class="form-input" data-tp="regProjectPh">
    </div>
    <div class="form-group">
      <label class="form-label" data-t="regLang"></label>

function saveJSON(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){
  // אחסון מלא (לרוב תמונות) — להתריע במקום לאבד נתונים בשקט
  try{toast(APP.lang==='ar'?'⚠️ الذاكرة ممتلئة — احذف صورًا/تقارير قديمة':'⚠️ הזיכרון מלא — מחק תמונות/דוחות ישנים',5000);}catch(_){}
  return false;
}}
function loadJSON(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}}
// מראה רשומה ל-Firebase (ללא תמונות כבדות — אלו יעברו ל-Storage בהמשך). חתימות נשמרות.
function cloudSave(coll,entry){
  if(!window._dkSaveDoc||!entry)return;
  var s=APP.settings||{};var owner=(s.managerPhone||'').replace(/\D/g,'');
  var docId=(owner||'x')+'_'+entry.id;
  var copy={};for(var k in entry){if(k==='photos')continue;copy[k]=entry[k];}
  if(entry.photos)copy.photoCount=entry.photos.length;
  copy.owner=owner;copy.ownerName=s.managerName||'';copy.project=s.projectName||'';
  copy.cloudAt=new Date().toISOString();
  try{window._dkSaveDoc(coll,docId,copy);}catch(e){}
  // העלאת תמונות ל-Storage (אסינכרוני) ועדכון הכתובות במסמך
  if(entry.photos&&entry.photos.length&&window._dkUploadPhotos){
    try{window._dkUploadPhotos('photos/'+(owner||'x')+'/'+coll+'/'+entry.id,entry.photos).then(function(urls){
      if(urls&&urls.length)window._dkSaveDoc(coll,docId,{photoUrls:urls});
    });}catch(e){}
  }
}
function cloudDelete(coll,entry){
  if(!window._dkDeleteDoc||!entry)return;
  var owner=((APP.settings&&APP.settings.managerPhone)||'').replace(/\D/g,'');
  try{window._dkDeleteDoc(coll,(owner||'x')+'_'+entry.id);}catch(e){}
}
function T(k){return(STRINGS[APP.lang]||STRINGS.he)[k]||k;}
function applyLang(){
  document.documentElement.lang=APP.lang;

  document.querySelectorAll('[data-tp]').forEach(function(el){el.placeholder=T(el.getAttribute('data-tp'));});

}
function setLang(lang){

function showScreen(id){

function getMessages(){return loadJSON('dk_messages',[]);}
function getLastRead(){return loadJSON('dk_msg_lastread',0);}
function unreadCount(){var lr=getLastRead();return getMessages().filter(function(m){return (m.ts||0)>lr;}).length;}
function updateMsgBanner(){
  var b=document.getElementById('msg-banner');if(!b)return;

var _sortedMsgs=[];
function renderMessages(){
  var list=document.getElementById('messages-list');if(!list)return;
  var msgs=getMessages().slice().sort(function(a,b){return (b.ts||0)-(a.ts||0);});

  else{
    var lr=getLastRead();var h='';
    for(var i=0;i<msgs.length;i++){
      var m=msgs[i];var isNew=(m.ts||0)>lr;
      var when=m.ts?new Date(m.ts).toLocaleString(APP.lang==='ar'?'ar-IL':'he-IL'):'';
      h+='<div style="background:#fff;border:1px solid var(--border);border-'+(APP.lang==='ar'?'right':'right')+':4px solid '+(isNew?'var(--blue)':'var(--border)')+';border-radius:12px;padding:14px 16px;margin-bottom:10px;box-shadow:0 1px 6px rgba(0,0,0,.05);">';
      h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;"><span style="font-size:11px;color:var(--blue);font-weight:700;">📢 '+T('msgFrom')+'</span>'+(isNew?'<span style="background:var(--blue);color:#fff;font-size:10px;font-weight:800;padding:2px 8px;border-radius:10px;">חדש</span>':'')+'</div>';
      if(m.title)h+='<div style="font-weight:800;font-size:16px;margin-bottom:4px;">'+esc(m.title)+'</div>';
      if(m.body)h+='<div style="font-size:14px;line-height:1.6;white-space:pre-wrap;color:var(--text);">'+esc(m.body)+'</div>';
      if(m.link)h+='<a href="'+esc(m.link)+'" target="_blank" style="display:inline-block;margin-top:8px;color:var(--blue);font-weight:700;font-size:14px;text-decoration:none;">'+T('msgOpenLink')+'</a>';
      h+='<div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;">';
      h+='<span style="font-size:11px;color:var(--sub);">'+when+'</span>';
      h+='<button onclick="replyToMessage('+i+')" style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px 14px;font-size:13px;font-weight:700;color:var(--blue);cursor:pointer;font-family:inherit;">'+T('msgReply')+'</button>';
      h+='</div>';
      h+='</div>';
    }
    list.innerHTML=h;
  }
  // סמן הכל כנקרא
  var msgsAll=getMessages();var maxTs=0;for(var j=0;j<msgsAll.length;j++)if((msgsAll[j].ts||0)>maxTs)maxTs=msgsAll[j].ts||0;
  saveJSON('dk_msg_lastread',maxTs);
  updateMsgBanner();
}

function presKey(){return 'pres_'+isoDate();}
function isoDate(d){d=d||new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function getPresenceToday(){return loadJSON(presKey(),[]);}
function initPresence(){
  document.getElementById('pres-date-sub').textContent=new Date().toLocaleDateString(APP.lang==='ar'?'ar-IL':'he-IL',{weekday:'long',day:'numeric',month:'long'});
  document.getElementById('pres-name').value='';document.getElementById('pres-trade').value='';
  renderPresence();
}
function addPresence(){
  var name=document.getElementById('pres-name').value.trim();
  if(!name){toast(APP.lang==='ar'?'أدخل اسم العامل':'יש להזין שם עובד');return;}
  var list=getPresenceToday();
  list.unshift({id:Date.now(),name:name,trade:document.getElementById('pres-trade').value.trim(),inTs:Date.now(),outTs:null});
  saveJSON(presKey(),list);
  document.getElementById('pres-name').value='';document.getElementById('pres-trade').value='';
  cloudSavePresence();renderPresence();
}
function presOut(id){
  var list=getPresenceToday();for(var i=0;i<list.length;i++)if(list[i].id===id){list[i].outTs=list[i].outTs?null:Date.now();break;}
  saveJSON(presKey(),list);cloudSavePresence();renderPresence();
}
function delPresence(id){var list=getPresenceToday().filter(function(p){return p.id!==id;});saveJSON(presKey(),list);cloudSavePresence();renderPresence();}

function renderPresence(){
  var list=getPresenceToday();var present=list.filter(function(p){return !p.outTs;}).length;
  document.getElementById('pres-count').textContent=present;

  if(!list.length){el.innerHTML='<div style="text-align:center;padding:24px;color:var(--sub);">'+T('presEmpty')+'</div>';return;}

    h+='<div style="display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--border);'+(out?'opacity:.55;':'')+'">'
      +'<span style="width:10px;height:10px;border-radius:50%;background:'+(out?'var(--sub)':'var(--green)')+';flex-shrink:0;"></span>'
      +'<div style="flex:1;min-width:0;"><div style="font-weight:700;">'+esc(p.name)+'</div><div style="font-size:12px;color:var(--sub);">'+(p.trade?esc(p.trade)+' · ':'')+T('presIn')+' '+fmtTime(p.inTs)+(out?' · '+T('presOut')+' '+fmtTime(p.outTs):'')+'</div></div>'
      +'<button class="btn-sm" onclick="presOut('+p.id+')" style="border:1.5px solid var(--border);border-radius:8px;background:white;padding:6px 12px;font-weight:700;cursor:pointer;color:'+(out?'var(--green)':'var(--orange)')+';">'+(out?'↩':T('presCheckout'))+'</button>'

function getReminders(){return loadJSON('dk_reminders',[]);}
function getSmartAlerts(){
  var alerts=[];
  var defs=loadJSON('sb_defects',[]);var today=isoDate();
  defs.forEach(function(d){if(d.status!=='done'&&d.deadline&&d.deadline<today)alerts.push({icon:'⚠️',text:T('remOverdue')+(d.desc||'').slice(0,40)});});
  var safety=loadJSON('sb_safety',[]);var hasToday=safety.some(function(r){return (r.date||'').slice(0,10)===today;});
  if(isFeatureOn('modSafety')&&!hasToday)alerts.push({icon:'🦺',text:T('remSafetyToday')});
  var journals=loadJSON('sb_journals',[]);
  if(journals[0]&&journals[0].tasks)alerts.push({icon:'📋',text:T('remTasksTomorrow')+journals[0].tasks.slice(0,50)});
  return alerts;
}
function renderReminders(){
  var smart=getSmartAlerts();var se=document.getElementById('rem-smart');
  if(!smart.length){se.innerHTML='<div style="color:var(--green);font-weight:700;padding:6px 2px;">'+T('remNoAlerts')+'</div>';}
  else{se.innerHTML=smart.map(function(a){return '<div style="display:flex;gap:8px;padding:9px 4px;border-bottom:1px solid var(--border);font-size:14px;"><span>'+a.icon+'</span><span>'+esc(a.text)+'</span></div>';}).join('');}
  var rem=getReminders();var el=document.getElementById('rem-list');
  if(!rem.length){el.innerHTML='<div style="text-align:center;padding:14px;color:var(--sub);">'+T('remEmpty')+'</div>';}
  else{
    var h='';rem.forEach(function(r){
      h+='<div style="display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--border);'+(r.done?'opacity:.5;':'')+'">'
        +'<input type="checkbox" '+(r.done?'checked':'')+' onchange="toggleReminder('+r.id+')" style="width:22px;height:22px;">'
        +'<div style="flex:1;'+(r.done?'text-decoration:line-through;':'')+'"><div style="font-weight:600;">'+esc(r.text)+'</div>'+(r.date?'<div style="font-size:12px;color:var(--sub);">'+T('remDate')+r.date+'</div>':'')+'</div>'
        +'<button onclick="delReminder('+r.id+')" style="background:none;border:none;color:#ccc;font-size:16px;cursor:pointer;">✕</button></div>';
    });
    el.innerHTML=h;
  }
}
function addReminder(){
  var text=document.getElementById('rem-text').value.trim();if(!text)return;
  var rem=getReminders();rem.unshift({id:Date.now(),text:text,date:document.getElementById('rem-date').value||'',done:false});

function toggleReminder(id){var rem=getReminders();for(var i=0;i<rem.length;i++)if(rem[i].id===id){rem[i].done=!rem[i].done;break;}saveJSON('dk_reminders',rem);renderReminders();updateReminderBadge();}
function delReminder(id){saveJSON('dk_reminders',getReminders().filter(function(r){return r.id!==id;}));renderReminders();updateReminderBadge();}
function updateReminderBadge(){
  var b=document.getElementById('rem-home-badge');if(!b)return;

function renderContractorScores(){
  var el=document.getElementById('con-list');if(!el)return;
  var defs=loadJSON('sb_defects',[]);
  var contractors=(APP.settings&&APP.settings.contractors)||[];
  // אסוף שמות קבלנים: מההגדרות + מתוך הליקויים
  var names={};contractors.forEach(function(c){names[c.name]={name:c.name,trade:c.trade||'',phone:c.phone||''};});
  defs.forEach(function(d){if(d.contractor&&!names[d.contractor])names[d.contractor]={name:d.contractor,trade:'',phone:d.contractorPhone||''};});
  var arr=Object.keys(names).map(function(k){return names[k];});
  if(!arr.length){el.innerHTML='<div style="text-align:center;padding:30px;color:var(--sub);">'+T('conEmpty')+'</div>';return;}
  var h='';
  arr.forEach(function(c){
    var mine=defs.filter(function(d){return d.contractor===c.name;});
    var open=mine.filter(function(d){return d.status!=='done';}).length;
    var done=mine.filter(function(d){return d.status==='done';});
    // זמן תיקון ממוצע (ימים) — מתאריך פתיחה ל-fix.when
    var sum=0,cnt=0;done.forEach(function(d){if(d.fix&&d.fix.when&&d.date){var diff=(new Date(d.fix.when)-new Date(d.date))/86400000;if(diff>=0){sum+=diff;cnt++;}}});
    var avg=cnt?(sum/cnt):null;
    // דירוג: פחות פתוחים + תיקון מהיר = יותר כוכבים
    var stars=5;if(open>=5)stars-=2;else if(open>=2)stars-=1;if(avg!==null&&avg>5)stars-=2;else if(avg!==null&&avg>2)stars-=1;if(stars<1)stars=1;
    var starStr='';for(var i=0;i<5;i++)starStr+=i<stars?'⭐':'☆';
    h+='<div class="card">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;"><div><span style="font-weight:800;font-size:16px;">'+esc(c.name)+'</span>'+(c.trade?' <span style="font-size:12px;color:var(--orange);background:#fef3e7;padding:2px 8px;border-radius:10px;">'+esc(c.trade)+'</span>':'')+'</div>'+(mine.length?'<span style="font-size:14px;">'+starStr+'</span>':'')+'</div>'
      +'<div style="display:flex;gap:8px;flex-wrap:wrap;font-size:13px;">'
      +'<span style="background:#fdecea;color:var(--red);padding:5px 10px;border-radius:8px;font-weight:700;">'+T('conOpen')+': '+open+'</span>'
      +'<span style="background:#eafaf1;color:var(--green);padding:5px 10px;border-radius:8px;font-weight:700;">'+T('conDone')+': '+done.length+'</span>'
      +(avg!==null?'<span style="background:var(--bg);padding:5px 10px;border-radius:8px;font-weight:700;">'+T('conAvg')+': '+avg.toFixed(1)+' '+T('conDays')+'</span>':'')
      +'</div>'
      +(c.phone?'<button class="btn btn-gray btn-sm" style="margin-top:10px;" onclick="openWhatsApp(\''+c.phone+'\',\'\')">📲 וואטסאפ</button>':'')
      +'</div>';
  });
  el.innerHTML=h;
}

function _voiceStopUI(){_voiceActive=false;if(_voiceBtn){_voiceBtn.innerHTML='🎙️';_voiceBtn.classList.remove('recording');}}
function toggleVoice(target,btnId){
  var b=document.getElementById(btnId);
  if(_voiceActive){_voiceActive=false;try{if(_recog)_recog.stop();}catch(e){}_voiceStopUI();return;}
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){toast(T('voiceNotSupported'));return;}
  // נקה מופע קודם אם נשאר
  if(_recog){try{_recog.onend=null;_recog.onresult=null;_recog.abort();}catch(e){}_recog=null;}
  _voiceTarget=target;_voiceBtn=b;
  var el0=document.getElementById(target);
  _voiceFinal=el0&&el0.value?(el0.value.replace(/\s+$/,'')+' '):'';  // המשך מטקסט קיים
  _recog=new SR();_recog.lang=APP.lang==='ar'?'ar-IL':'he-IL';_recog.continuous=true;_recog.interimResults=true;
  _recog.onresult=function(e){
    // בנייה-מחדש מלאה מכל התוצאות בכל אירוע — מונע כפילות (אין צבירה)
    var txt='';
    for(var i=0;i<e.results.length;i++){ txt+=e.results[i][0].transcript+' '; }
    var el=document.getElementById(_voiceTarget);if(el)el.value=(_voiceFinal+txt).replace(/[ \t]+/g,' ').replace(/^\s+/,'');
  };
  _recog.onerror=function(err){if(err.error==='not-allowed')toast(T('voiceDenied'));else if(err.error!=='aborted'&&err.error!=='no-speech')toast(T('voiceError'));};
  // ללא הפעלה-מחדש אוטומטית (גרמה לכפילות). בסיום — הכפתור חוזר למצב מוכן, הטקסט נשמר.
  _recog.onend=function(){_voiceStopUI();};

}

// ===== עזר חתימה גנרי (שימוש חוזר לכמה קנבסים) =====
function attachSignPad(canvas){
  if(!canvas)return null;
  var ctx=canvas.getContext('2d');canvas.width=canvas.offsetWidth||400;canvas.height=110;ctx.clearRect(0,0,canvas.width,canvas.height);
  var drawing=false,dirty=false;
  function pos(e){var r=canvas.getBoundingClientRect();var pt=e.touches?e.touches[0]:e;return{x:pt.clientX-r.left,y:pt.clientY-r.top};}
  function down(e){if(e.preventDefault)e.preventDefault();drawing=true;dirty=true;var p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);}
  function move(e){if(!drawing)return;if(e.preventDefault)e.preventDefault();var p=pos(e);ctx.lineTo(p.x,p.y);ctx.strokeStyle='#222';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.stroke();}
  function up(){drawing=false;}
  canvas.onmousedown=down;canvas.onmousemove=move;canvas.onmouseup=up;canvas.onmouseleave=up;
  canvas.addEventListener('touchstart',down,{passive:false});canvas.addEventListener('touchmove',move,{passive:false});canvas.addEventListener('touchend',up);
  return {clear:function(){ctx.clearRect(0,0,canvas.width,canvas.height);dirty=false;},isEmpty:function(){return !dirty;},dataURL:function(){return dirty?canvas.toDataURL('image/png'):'';}};
}

function getWorkers(){
  var d=[];
  for(var i=0;i<WKEYS.length;i++){var el=document.getElementById('w-'+WKEYS[i]);var q=el?parseInt(el.value)||0:0;if(q>0)d.push({trade:T(WKEYS[i]),qty:q});}
  document.querySelectorAll('#workers-tbody tr.custom-trade').forEach(function(tr){
    var nm=(tr.querySelector('.ct-name')||{}).value;var qv=parseInt((tr.querySelector('.ct-qty')||{}).value)||0;
    if(nm&&nm.trim()&&qv>0)d.push({trade:nm.trim(),qty:qv});
  });
  return d;
}
function nextJournalSerial(){var n=loadJSON('dk_journal_serial',0);n=(parseInt(n)||0)+1;saveJSON('dk_journal_serial',n);return n;}
function fmtSerial(n){var s=''+(n||0);while(s.length<3)s='0'+s;return s;}
function saveJournal(){
  var txt=document.getElementById('jnl-text').value.trim();
  if(!txt){toast(APP.lang==='ar'?'أدخل وصف اليوم':'יש להזין תיאור יום העבודה');return;}
  if(!jnlSignPad||jnlSignPad.isEmpty()){toast(T('signRequired'));var sc=document.getElementById('jnl-sign-canvas');if(sc)sc.scrollIntoView({behavior:'smooth',block:'center'});return;}
  var entry={id:Date.now(),serial:nextJournalSerial(),date:new Date().toISOString(),ts:Date.now(),text:txt,workers:getWorkers(),weather:currentWeather,delays:document.getElementById('jnl-delays').value.trim(),tasks:document.getElementById('jnl-tasks').value.trim(),photos:APP.jnlPhotos.slice(),managerSign:jnlSignPad.dataURL(),manager:APP.settings.managerName||'',locked:true,supervisorApproval:null,lang:APP.lang};
  var journals=loadJSON('sb_journals',[]);journals.unshift(entry);saveJSON('sb_journals',journals);
  cloudSave('journals',entry);
  toast(T('saved'));showJournalReport(entry);
}
function sendJournalWA(){
  var s=APP.settings;var msg=(s.projectName||'אתר')+'\n'+new Date().toLocaleDateString('he-IL')+'\n\n';
  var txt=document.getElementById('jnl-text').value.trim();if(txt)msg+=txt+'\n\n';
  var workers=getWorkers();if(workers.length){msg+=T('workersTitle')+':\n';for(var i=0;i<workers.length;i++)msg+=workers[i].trade+': '+workers[i].qty+'\n';msg+='\n';}
  if(currentWeather>=0)msg+=T('weatherTitle')+': '+T('wl'+currentWeather)+'\n';
  var d=document.getElementById('jnl-delays').value.trim();if(d)msg+=T('delaysTitle')+':\n'+d+'\n\n';
  var t=document.getElementById('jnl-tasks').value.trim();if(t)msg+=T('tasksTitle')+':\n'+t+'\n';
  openWhatsApp(s.officePhone||'',msg);
}
// שליחה אחידה לוואטסאפ — ישר לאפליקציה בטלפון (deep link), לא חלון דפדפן חדש
function openWhatsApp(phone,text){
  var p=(phone||'').replace(/\D/g,'');
  if(p&&p.charAt(0)==='0')p='972'+p.slice(1);            // המרה לפורמט בינלאומי
  else if(p&&p.indexOf('972')!==0&&p.length<=10)p='972'+p;
  var enc=encodeURIComponent(text);
  var isMobile=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent||'');
  if(isMobile){
    // פתיחה ישירה של אפליקציית וואטסאפ — אותו חלון, ללא טאב דפדפן
    window.location.href='whatsapp://send?'+(p?'phone='+p+'&':'')+'text='+enc;
  } else {
    // דסקטופ — וואטסאפ ווב בטאב חדש
    window.open('https://wa.me/'+(p||'')+'?text='+enc,'_blank');
  }
}
function openOfficeWA(msg){openWhatsApp(APP.settings.officePhone||'',msg);}
function shareReportWA(){
  var cr=window._currentReport;if(!cr){return;}
  var s=APP.settings;var e=cr.entry;
  var dd=new Date(e.date).toLocaleDateString(APP.lang==='ar'?'ar-IL':'he-IL');
  var line='━━━━━━━━━━━━━━━';
  var msg='';
  if(cr.type==='journal'){
    msg='📋 *'+(APP.lang==='ar'?'يومية عمل':'יומן עבודה')+'*'+(e.serial?'  ·  '+T('journalSerial')+' '+fmtSerial(e.serial):'')+'\n'+line+'\n';
    msg+='🏗️ *'+(s.projectName||'')+'*\n';
    msg+='📅 '+dd+'\n';
    msg+='👷 '+(APP.lang==='ar'?'مدير العمل':'מנהל עבודה')+': '+(e.manager||s.managerName||'')+'\n';
    msg+=line+'\n';
    if(e.text)msg+='*'+T('reportWorkDesc')+':*\n'+e.text+'\n\n';
    if(e.workers&&e.workers.length){var tot=0;e.workers.forEach(function(w){tot+=w.qty;});msg+='*'+T('reportManpower')+' ('+tot+'):*\n';for(var i=0;i<e.workers.length;i++)msg+='   • '+e.workers[i].trade+': *'+e.workers[i].qty+'*\n';msg+='\n';}
    if(e.weather>=0)msg+='*'+T('weatherTitle')+':* '+T('wi'+e.weather)+' '+T('wl'+e.weather)+'\n';
    if(e.delays)msg+='\n⚠️ *'+T('delaysTitle')+':*\n'+e.delays+'\n';
    if(e.tasks)msg+='\n📌 *'+T('tasksTitle')+':*\n'+e.tasks+'\n';
    msg+=line+'\n';
    if(e.supervisorApproval)msg+='✅ *'+T('approvedBadge')+'* — '+e.supervisorApproval.name+'\n';
    else msg+='✍️ '+T('pendingApproval')+'\n';
  } else {
    var fails=0,oks=0;for(var k in e.answers){if(e.answers[k]==='fail')fails++;else if(e.answers[k]==='ok')oks++;}
    msg='🦺 *'+T('reportSafetyTitle')+'*\n'+line+'\n';
    msg+='🏗️ *'+(s.projectName||'')+'*\n📅 '+dd+'\n👷 '+(s.managerName||'')+'\n';
    if(e.stageLabel)msg+='🔧 '+e.stageLabel+'\n';
    msg+=line+'\n';
    msg+='✅ '+(APP.lang==='ar'?'سليم':'תקין')+': *'+oks+'*      ❌ '+(APP.lang==='ar'?'ليقوי':'ליקוי')+': *'+fails+'*\n';
    // פירוט הליקויים בלבד
    if(fails>0){msg+='\n⚠️ *'+(APP.lang==='ar'?'العيوب':'הליקויים')+':*\n';var qs=e.questions||[];for(var qi=0;qi<qs.length;qi++){if(e.answers[qs[qi].qKey]==='fail')msg+='   ❌ '+T(qs[qi].qKey)+'\n';}}
    msg+=line+'\n';
    msg+=(fails?('🔴 '+(APP.lang==='ar'?'يتطلب معالجة فورية':'דורש טיפול מיידי')):('🟢 '+(APP.lang==='ar'?'الموقع آمن':'האתר תקין')))+'\n';
    if(e.gps)msg+='📍 '+e.gps+'\n';
  }
  msg+='\n_'+(APP.lang==='ar'?'أُرسل عبر تطبيق דקה':'נשלח מאפליקציית דקה')+'_';
  openOfficeWA(msg);
}
function renderJournalHistory(){
  var list=document.getElementById('journal-history-list');if(!list)return;
  var journals=loadJSON('sb_journals',[]);
  if(!journals.length){list.innerHTML='<div style="text-align:center;padding:40px 20px;color:var(--sub);white-space:pre-line;">'+T('emptyJournal')+'</div>';return;}
  var h='';
  for(var i=0;i<journals.length;i++){
    var j=journals[i];var d=new Date(j.date);
    var ds=d.toLocaleDateString('he-IL',{year:'numeric',month:'long',day:'numeric'});
    var tw=0;if(j.workers)for(var k=0;k<j.workers.length;k++)tw+=j.workers[k].qty;
    var serialStr=j.serial?(T('journalSerial')+' '+fmtSerial(j.serial)+' · '):'';
    var appBadge=j.supervisorApproval
      ?'<span style="font-size:11px;color:var(--green);font-weight:700;">'+T('approvedBadge')+'</span>'
      :'<span style="font-size:11px;color:var(--orange);font-weight:700;">'+T('pendingApproval')+'</span>';
    h+='<div class="history-item" onclick="showJournalReportById('+j.id+')">'
      +'<div class="history-item-date">'+serialStr+ds+'</div>'
      +'<div class="history-item-sub">'+T('totalWorkers')+': '+tw+' &nbsp;·&nbsp; '+appBadge+'</div>'
      +'</div>';
  }
  list.innerHTML=h;
}
function showJournalReportById(id){
  var journals=loadJSON('sb_journals',[]);
  var entry=journals.find(function(j){return j.id===id;});
  if(!entry){toast('לא נמצא יומן');return;}
  showJournalReport(entry);
}
var _viewedJournalId=null;
function showJournalReport(entryOrStr){
  var entry=typeof entryOrStr==='string'?JSON.parse(entryOrStr):entryOrStr;
  _viewedJournalId=entry.id;
  window._currentReport={type:'journal',entry:entry};
  var el=document.getElementById('report-content');var s=APP.settings;
  var d=new Date(entry.date);var ds=d.toLocaleDateString('he-IL',{year:'numeric',month:'long',day:'numeric'});
  var serialStr=entry.serial?(T('journalSerial')+' '+fmtSerial(entry.serial)):'';
  document.getElementById('report-topbar-title').textContent=T('reportJournalTitle')+ds;
  var h='<div class="report-logo"><div class="report-logo-title">דקה</div><div class="report-logo-sub">'+T('appTagline')+'</div></div>';
  h+='<div class="report-header"><p><strong>'+T('reportProject')+'</strong>'+(s.projectName||'—')+'</p><p><strong>'+T('reportManager')+'</strong>'+(entry.manager||s.managerName||'—')+'</p><p><strong>'+T('reportDate')+'</strong>'+ds+'</p>'+(serialStr?'<p><strong>'+serialStr+'</strong></p>':'')+'</div>';
  h+='<div class="report-section-title">'+T('reportWorkDesc')+'</div><p>'+(entry.text||'').replace(/\n/g,'<br>')+'</p>';
  if(entry.workers&&entry.workers.length){
    h+='<div class="report-section-title">'+T('reportManpower')+'</div><table style="width:100%;border-collapse:collapse;font-size:13px;"><tr><th style="text-align:right;padding:6px;border-bottom:1px solid #dce3e9;">'+T('tradeCol')+'</th><th style="text-align:center;padding:6px;border-bottom:1px solid #dce3e9;">'+T('qtyCol')+'</th></tr>';
    var tw=0;for(var i=0;i<entry.workers.length;i++){h+='<tr><td style="padding:5px 6px;">'+entry.workers[i].trade+'</td><td style="text-align:center;">'+entry.workers[i].qty+'</td></tr>';tw+=entry.workers[i].qty;}
    h+='<tr style="font-weight:700;"><td style="padding:5px 6px;">'+T('totalWorkers')+'</td><td style="text-align:center;">'+tw+'</td></tr></table>';
  }
  if(entry.weather>=0||entry.delays||entry.tasks){
    h+='<div class="report-section-title">'+T('reportConditions')+'</div>';
    if(entry.weather>=0)h+='<p>'+T('reportWeather')+T('wl'+entry.weather)+'</p>';
    if(entry.delays)h+='<p>'+T('reportDelays')+'</p><p>'+esc(entry.delays).replace(/\n/g,'<br>')+'</p>';
    if(entry.tasks)h+='<p>'+T('reportTasks')+'</p><p>'+esc(entry.tasks).replace(/\n/g,'<br>')+'</p>';
  }
  if(entry.photos&&entry.photos.length){h+='<div class="report-section-title">'+T('reportPhotos')+'</div><div class="photos-grid">';for(var p=0;p<entry.photos.length;p++)h+='<div class="photo-thumb"><img src="'+entry.photos[p]+'"></div>';h+='</div>';}
  // ===== חתימות =====
  h+='<div style="display:flex;gap:14px;margin-top:18px;flex-wrap:wrap;">';
  // חתימת מנהל עבודה
  h+='<div style="flex:1;min-width:140px;text-align:center;">'
    +'<div style="font-size:12px;color:var(--sub);font-weight:700;margin-bottom:4px;">'+T('reportManagerSign')+'</div>'
    +(entry.managerSign?'<img src="'+entry.managerSign+'" style="max-width:100%;height:70px;object-fit:contain;border:1px solid #dce3e9;border-radius:8px;background:#fff;">':'<div style="height:70px;border:1px dashed #dce3e9;border-radius:8px;"></div>')
    +'<div style="font-size:12px;margin-top:4px;font-weight:700;">'+esc(entry.manager||s.managerName||'')+'</div></div>';
  // חתימת מפקח
  h+='<div style="flex:1;min-width:140px;text-align:center;">'
    +'<div style="font-size:12px;color:var(--sub);font-weight:700;margin-bottom:4px;">'+T('reportSupervisorSign')+'</div>';
  if(entry.supervisorApproval){
    var aw=new Date(entry.supervisorApproval.ts).toLocaleString('he-IL');
    h+='<img src="'+entry.supervisorApproval.sign+'" style="max-width:100%;height:70px;object-fit:contain;border:1px solid #27ae60;border-radius:8px;background:#fff;">'
      +'<div style="font-size:12px;margin-top:4px;font-weight:700;color:var(--green);">'+esc(entry.supervisorApproval.name)+'</div>'
      +'<div style="font-size:10px;color:var(--sub);">'+aw+'</div>';
  } else {
    h+='<div style="height:70px;border:1px dashed #dce3e9;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--sub);">'+T('pendingApproval')+'</div>';
  }
  h+='</div></div>';
  h+='<div class="report-footer">'+T('reportFooter')+'<br>'+T('reportGenerated')+new Date().toLocaleString('he-IL')+'</div>';
  el.innerHTML=h;
  // כפתור אישור פיקוח (לא מודפס)
  var approveBar=document.getElementById('report-approve-bar');
  if(approveBar){
    if(entry.supervisorApproval||!isFeatureOn('supervisorApproval')){approveBar.style.display='none';}
    else{approveBar.style.display='block';}
  }
  showScreen('s-report');
}

var supSignPad=null;
function openSupervisorApprove(){
  if(!_viewedJournalId){return;}
  document.getElementById('sup-name').value=APP.settings.officeName||'';
  openModal('modal-supervisor');
  setTimeout(function(){supSignPad=attachSignPad(document.getElementById('sup-sign-canvas'));},50);
}
function clearSupSign(){if(supSignPad)supSignPad.clear();}
function saveSupervisorApprove(){
  var name=document.getElementById('sup-name').value.trim();
  if(!name){toast(T('supervisorName'));return;}
  if(!supSignPad||supSignPad.isEmpty()){toast(T('signRequired'));return;}
  var journals=loadJSON('sb_journals',[]);
  var entry=null;
  for(var i=0;i<journals.length;i++){if(journals[i].id===_viewedJournalId){journals[i].supervisorApproval={name:name,sign:supSignPad.dataURL(),ts:Date.now()};entry=journals[i];break;}}
  saveJSON('sb_journals',journals);
  if(entry)cloudSave('journals',entry);
  closeModal('modal-supervisor');
  toast(T('approvedBadge'));
  if(entry)showJournalReport(entry);
}function renderDefectFilters(){
  var el=document.getElementById('defect-filters');if(!el)return;
  var fs=[{k:'all',l:'filterAll'},{k:'open',l:'filterOpen'},{k:'progress',l:'filterProgress'},{k:'done',l:'filterDone'}];
  var h='';for(var i=0;i<fs.length;i++){var f=fs[i];h+='<div class="filter-tab'+(APP.currentFilter===f.k?' active':'')+'" onclick="setDefFilter(\''+f.k+'\')">'+T(f.l)+'</div>';}
  el.innerHTML=h;
}
function setDefFilter(f){APP.currentFilter=f;renderDefectFilters();renderDefects();}
function renderDefects(){
  var list=document.getElementById('defects-list');if(!list)return;
  var defects=loadJSON('sb_defects',[]);
  var filtered=defects.filter(function(d){return APP.currentFilter==='all'||d.status===APP.currentFilter;});
  if(!defects.length){list.innerHTML='<div style="text-align:center;padding:40px 20px;color:var(--sub);white-space:pre-line;">'+T('emptyDefects')+'</div>';return;}
  if(!filtered.length){list.innerHTML='<div style="text-align:center;padding:40px 20px;color:var(--sub);">'+T('emptyDefectsFilter')+'</div>';return;}
  var h='';
  for(var i=0;i<filtered.length;i++){
    var d=filtered[i];
    var sc='sev-'+(d.severity||'normal');
    var sk=d.severity==='urgent'?'sevUrgent':d.severity==='low'?'sevLow':'sevNormal';
    var bc=d.severity==='urgent'?'urgent':d.severity==='low'?'low':'normal';
    var dl='';
    if(d.deadline){var dlD=new Date(d.deadline);var now=new Date();now.setHours(0,0,0,0);dl=dlD<now&&d.status!=='done'?'<span style="color:var(--red);">'+T('overdue')+'</span>':T('targetDate')+dlD.toLocaleDateString('he-IL');}
    else dl=T('noDeadline');
    var oa=d.status==='open'?' active-open':'';var pa=d.status==='progress'?' active-progress':'';var da=d.status==='done'?' active-done':'';
    h+='<div class="defect-card '+sc+'">';
    h+='<div class="defect-header"><div class="defect-desc">'+esc(d.desc||'')+'</div><span class="sev-badge '+bc+'">'+T(sk)+'</span></div>';
    h+='<div class="defect-meta">';
    if(d.floor||d.area)h+='<span>📍 '+esc((d.floor||'')+(d.area?' / '+d.area:''))+'</span>';
    if(d.contractor)h+='<span>👷 '+esc(d.contractor)+'</span>';
    h+='<span>'+dl+'</span></div>';
    if(d.photos&&d.photos.length){h+='<div class="photos-grid" style="margin-bottom:10px;">';for(var p=0;p<Math.min(d.photos.length,3);p++)h+='<div class="photo-thumb"><img src="'+d.photos[p]+'"></div>';h+='</div>';}
    // פרטי תיקון אם קיימים
    if(d.fix){
      var fdt=d.fix.when?new Date(d.fix.when).toLocaleString(APP.lang==='ar'?'ar-IL':'he-IL'):'';
      h+='<div class="fix-panel">';
      h+='<div class="fix-panel-title">'+T('fixedLabel')+'</div>';
      if(d.fix.by)h+='<div class="fix-row"><span class="fix-lbl">'+T('fixedBy')+'</span><span>'+esc(d.fix.by)+'</span></div>';
      if(fdt)h+='<div class="fix-row"><span class="fix-lbl">'+T('fixedAt')+'</span><span>'+fdt+'</span></div>';
      if(d.floor||d.area)h+='<div class="fix-row"><span class="fix-lbl">📍</span><span>'+esc((d.floor||'')+(d.area?' / '+d.area:''))+'</span></div>';
      if(d.fix.notes)h+='<div class="fix-row"><span class="fix-lbl">'+T('fixedNote')+'</span><span>'+esc(d.fix.notes)+'</span></div>';
      if(d.fix.photo)h+='<div style="margin-top:8px;"><img src="'+d.fix.photo+'" style="width:100%;max-height:160px;object-fit:cover;border-radius:8px;"></div>';
      h+='</div>';
    }
    h+='<div class="defect-actions">';
    if(d.status!=='done'){
      h+='<button class="status-btn'+oa+'" onclick="setDefStatus('+d.id+',\'open\')">'+T('filterOpen')+'</button>';
      h+='<button class="status-btn'+pa+'" onclick="setDefStatus('+d.id+',\'progress\')">'+T('btnProgress')+'</button>';
      h+='<button class="btn-fix-main" onclick="openFixModal('+d.id+')">'+T('fixBtn')+'</button>';
    } else {
      h+='<button class="status-btn" onclick="setDefStatus('+d.id+',\'open\')" style="opacity:.6;font-size:12px;">↩ פתח מחדש</button>';
    }
    h+='<button class="status-btn" onclick="sendDefWA('+d.id+')">'+T('btnWA')+'</button>';
    h+='<button class="status-btn" onclick="delDefect('+d.id+')" style="background:#fdecea;color:var(--red);">🗑️</button>';
    h+='</div></div>';
  }
  list.innerHTML=h;
}
function openAddDefect(){APP.defectPhotos=[];APP.selectedSev='normal';document.getElementById('def-desc').value='';document.getElementById('def-floor').value='';document.getElementById('def-area').value='';document.getElementById('def-deadline').value='';renderDefectPhotos();populateContractorSelect();updateSevBtns();openModal('modal-defect');}
function renderDefectPhotos(){
  var g=document.getElementById('defect-photos-grid');if(!g)return;
  var h='';for(var i=0;i<APP.defectPhotos.length;i++)h+='<div class="photo-thumb"><img src="'+APP.defectPhotos[i]+'"><button class="photo-del" onclick="removeDefPhoto('+i+')">×</button></div>';
  h+='<div class="photo-add" onclick="document.getElementById(\'defect-photo-input\').click()"><span class="photo-add-icon">📷</span><span>+</span></div>';
  g.innerHTML=h;
}
function handleDefectPhotos(e){var fs=e.target.files;for(var i=0;i<fs.length;i++){(function(f){var r=new FileReader();r.onload=function(ev){APP.defectPhotos.push(ev.target.result);renderDefectPhotos();};r.readAsDataURL(f);})(fs[i]);}e.target.value='';}
function removeDefPhoto(i){APP.defectPhotos.splice(i,1);renderDefectPhotos();}
function populateContractorSelect(){
  var sel=document.getElementById('def-contractor');if(!sel)return;
  var cs=APP.settings.contractors||[];
  var h='<option value="">'+(APP.lang==='ar'?'اختر مقاولاً':'בחר קבלן')+'</option>';
  for(var i=0;i<cs.length;i++)h+='<option value="'+esc(cs[i].name)+'">'+esc(cs[i].name)+(cs[i].trade?' ('+esc(cs[i].trade)+')':'')+'</option>';
  sel.innerHTML=h;
}
function selectSev(s){APP.selectedSev=s;updateSevBtns();}
function updateSevBtns(){
  document.querySelectorAll('#sev-btns .status-btn').forEach(function(b){
    b.classList.remove('active-open','active-progress','active-done');
    if(b.dataset.sev===APP.selectedSev){if(APP.selectedSev==='urgent')b.classList.add('active-open');else if(APP.selectedSev==='normal')b.classList.add('active-progress');else b.classList.add('active-done');}
  });
}
function saveDefect(){
  var desc=document.getElementById('def-desc').value.trim();if(!desc){toast(T('defDescPlaceholder'));return;}
  var defects=loadJSON('sb_defects',[]);
  var entry={id:Date.now(),ts:Date.now(),date:new Date().toISOString(),desc:desc,floor:document.getElementById('def-floor').value.trim(),area:document.getElementById('def-area').value.trim(),contractor:document.getElementById('def-contractor').value,deadline:document.getElementById('def-deadline').value,severity:APP.selectedSev,status:'open',photos:APP.defectPhotos.slice()};
  defects.unshift(entry);saveJSON('sb_defects',defects);cloudSave('defects',entry);closeModal('modal-defect');toast(T('saved'));renderDefects();

var SAFETY_EXTRAS={structure:['sq_struct1','sq_struct2','sq_struct3'],finishing:['sq_fin1','sq_fin2','sq_fin3'],scaffolding:['sq_scaf1','sq_scaf2','sq_scaf3'],excavation:['sq_exc1','sq_exc2','sq_exc3']};
function getSafetyQs(wt){
  var base=['sq1','sq2','sq3','sq4','sq5','sq6','sq7','sq8','sq9','sq10','sq11','sq12'];
  var arr=base.map(function(k){return{qKey:k,aKey:k+'a',special:false};});

function getActiveQs(){

  var arr=base.map(function(k){return{qKey:k,aKey:k+'a',special:false};});

var signCanvas,signCtx,signing=false;
function initSignature(){
  signCanvas=document.getElementById('sign-canvas');if(!signCanvas)return;
  signCtx=signCanvas.getContext('2d');signCanvas.width=signCanvas.offsetWidth||400;signCanvas.height=110;
  signCtx.clearRect(0,0,signCanvas.width,signCanvas.height);
  signCanvas.onmousedown=function(e){signing=true;var p=sPos(e);signCtx.beginPath();signCtx.moveTo(p.x,p.y);};
  signCanvas.onmousemove=function(e){if(!signing)return;var p=sPos(e);signCtx.lineTo(p.x,p.y);signCtx.strokeStyle='#222';signCtx.lineWidth=2.5;signCtx.lineCap='round';signCtx.stroke();};
  signCanvas.onmouseup=function(){signing=false;};signCanvas.onmouseleave=function(){signing=false;};
  signCanvas.addEventListener('touchstart',function(e){e.preventDefault();signing=true;var t=e.touches[0];var r=signCanvas.getBoundingClientRect();signCtx.beginPath();signCtx.moveTo(t.clientX-r.left,t.clientY-r.top);},{passive:false});
  signCanvas.addEventListener('touchmove',function(e){e.preventDefault();if(!signing)return;var t=e.touches[0];var r=signCanvas.getBoundingClientRect();signCtx.lineTo(t.clientX-r.left,t.clientY-r.top);signCtx.strokeStyle='#222';signCtx.lineWidth=2.5;signCtx.lineCap='round';signCtx.stroke();},{passive:false});
  signCanvas.addEventListener('touchend',function(){signing=false;});
}
function sPos(e){var r=signCanvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
function clearSignature(){if(signCtx)signCtx.clearRect(0,0,signCanvas.width,signCanvas.height);}

    document.getElementById('sf-photo-preview').innerHTML='<div style="position:relative;display:inline-block;width:100%;"><img src="'+_sfPhoto+'" style="width:100%;max-height:160px;object-fit:cover;border-radius:8px;"><button onclick="_sfPhoto=null;document.getElementById(\'sf-photo-preview\').innerHTML=\'\'" style="position:absolute;top:6px;left:6px;background:rgba(231,76,60,.9);color:white;border:none;border-radius:50%;width:28px;height:28px;font-size:14px;cursor:pointer;">✕</button></div>';
  };
  r.readAsDataURL(f);input.value='';
}
function saveSafetyFix(){
  var by=document.getElementById('sf-by').value.trim();
  var when=document.getElementById('sf-when').value;
  var notes=document.getElementById('sf-notes').value.trim();
  if(!by){toast(APP.lang==='ar'?'يرجى إدخال اسم المُصلِح':'יש להזין מי ביצע את התיקון');return;}
  var safety=loadJSON('sb_safety',[]);
  for(var i=0;i<safety.length;i++){
    if(safety[i].id===_sfReportId){
      if(!safety[i].fixes)safety[i].fixes={};
      safety[i].fixes[_sfQuestionKey]={by:by,when:when,notes:notes,photo:_sfPhoto||null};
      break;
    }
  }
  saveJSON('sb_safety',safety);
  closeModal('modal-safety-fix');
  toast(T('fixedLabel')+' ✅');
  // רענן את הדוח המוצג
  var entry=safety.find(function(r){return r.id===_sfReportId;});
  if(entry)showSafetyReport(entry);
}

// ===================== REGISTRATION =====================
function setRegLang(lang){
  APP.lang=lang;
  document.getElementById('reglang-he').classList.toggle('active',lang==='he');
  document.getElementById('reglang-ar').classList.toggle('active',lang==='ar');
  applyLang();
}

function submitRegistration(){
  var name=document.getElementById('reg-name').value.trim();
  var phone=document.getElementById('reg-phone').value.trim();
  var company=document.getElementById('reg-company').value.trim();
  var project=document.getElementById('reg-project').value.trim();
  if(!name){toast(APP.lang==='ar'?'يرجى إدخال الاسم الكامل':'יש להזין שם מלא');document.getElementById('reg-name').focus();return;}
  if(!phone){toast(APP.lang==='ar'?'يرجى إدخال رقم الهاتف':'יש להזין מספר טלפון');document.getElementById('reg-phone').focus();return;}
  // שמור הגדרות
  APP.settings.managerName=name;
  APP.settings.managerPhone=phone;
  APP.settings.companyName=company;
  APP.settings.projectName=project;
  APP.settings.lang=APP.lang;
  APP.settings.registered=true;
  APP.settings.registeredAt=new Date().toISOString();
  saveJSON('sb_settings',APP.settings);
  // שליחה ל-Firebase (אם מחובר)
  if(window._dkRegister)try{window._dkRegister({name:name,phone:phone,company:company,project:project,lang:APP.lang,registeredAt:APP.settings.registeredAt});}catch(e){}
  toast((APP.lang==='ar'?'أهلاً ':' ברוך הבא ')+name+' 👋',3000);
  showScreen('s-home');
}

function isRegistered(){
  var s=loadJSON('sb_settings',{});
  // תואם גרסות ישנות: אם יש שם מנהל (גם בלי דגל registered) — נחשב רשום
  if(s&&s.managerName){
    if(!s.registered){s.registered=true;saveJSON('sb_settings',s);}
    return true;
  }
  return false;
}

// ===================== פיצ'רים מתקדמים (גילוי מדורג) =====================
// שכבה 1: זמינות נקבעת ע"י הבעלים (APP.features מה-Firebase). שכבה 2: המנהל בוחר להציג/להסתיר (APP.userPrefs).
// כל הפיצ'רים במערכת — def=ברירת מחדל זמינות (core דלוק, מתקדם כבוי)
var ALL_FEATURES=[
  {k:'modJournal',he:'יומן עבודה',ar:'يومية العمل',def:true},
  {k:'modDefects',he:'ליקויים ומשימות',ar:'العيوب والمهام',def:true},
  {k:'modSafety',he:'בטיחות יומית',ar:'السلامة اليومية',def:true},
  {k:'modPresence',he:'נוכחות עובדים',ar:'حضور العمال',def:false},
  {k:'modReminders',he:'תזכורות ומשימות',ar:'تذكيرات ومهام',def:false},
  {k:'modIncidents',he:'דיווח אירועים ותאונות',ar:'تبليغ الحوادث',def:false},
  {k:'modOnboard',he:'קליטת עובדים זרים',ar:'استقبال العمال الأجانب',def:false},
  {k:'modContractors',he:'קבלני משנה',ar:'مقاولو الباطن',def:false},
  {k:'modPermits',he:'היתרי עבודה',ar:'تصاريح العمل',def:false},
  {k:'messages',he:'הודעות מהמשרד',ar:'رسائل المكتب',def:true},
  {k:'supervisorApproval',he:'אישור פיקוח ביומן',ar:'مصادقة المشرف',def:false},
  {k:'safetyStages',he:'שאלות בטיחות לפי שלב',ar:'أسئلة سلامة حسب المرحلة',def:false},
  {k:'customTrades',he:'הוספת מקצוע ביומן',ar:'إضافة مهنة',def:false}
];
function featDefault(k){for(var i=0;i<ALL_FEATURES.length;i++)if(ALL_FEATURES[i].k===k)return ALL_FEATURES[i].def;return false;}
function featAvailable(k){var f=APP.features||{};return (f[k]!==undefined)?!!f[k]:featDefault(k);} // זמינות (בעלים/ברירת מחדל)
function isFeatureOn(k){
  if(!featAvailable(k))return false;
  return (APP.userPrefs||{})[k]!==false;   // המנהל לא הסתיר
}
function applyFeatures(){
  var b=document.getElementById('btn-add-trade');if(b)b.style.display=isFeatureOn('customTrades')?'':'none';
  var hj=document.getElementById('home-mod-journal');if(hj)hj.style.display=isFeatureOn('modJournal')?'':'none';
  var hd=document.getElementById('home-mod-defects');if(hd)hd.style.display=isFeatureOn('modDefects')?'':'none';
  var hs=document.getElementById('home-mod-safety');if(hs)hs.style.display=isFeatureOn('modSafety')?'':'none';
  var hp=document.getElementById('home-mod-presence');if(hp)hp.style.display=isFeatureOn('modPresence')?'':'none';
  var hr=document.getElementById('home-mod-reminders');if(hr)hr.style.display=isFeatureOn('modReminders')?'':'none';
  var hi=document.getElementById('home-mod-incidents');if(hi)hi.style.display=isFeatureOn('modIncidents')?'':'none';
  var ho=document.getElementById('home-mod-onboard');if(ho)ho.style.display=isFeatureOn('modOnboard')?'':'none';
  var hc=document.getElementById('home-mod-contractors');if(hc)hc.style.display=isFeatureOn('modContractors')?'':'none';
  var hpm=document.getElementById('home-mod-permits');if(hpm)hpm.style.display=isFeatureOn('modPermits')?'':'none';
  if(typeof updateReminderBadge==='function')updateReminderBadge();
  updateMsgBanner();
  var act=document.querySelector('.screen.active');
  if(act&&act.id==='s-safety')renderSafetyQuestions();
}
window._dkOnFeatures=function(f){
  APP.features=f||{};
  saveJSON('dk_features',APP.features);applyFeatures();
  var act=document.querySelector('.screen.active');if(act&&act.id==='s-settings')renderFeaturePrefs();
};
function toggleUserPref(k,on){
  if(!APP.userPrefs)APP.userPrefs={};
  APP.userPrefs[k]=on;saveJSON('dk_user_prefs',APP.userPrefs);applyFeatures();
}
function renderFeaturePrefs(){
  var wrap=document.getElementById('feature-prefs');if(!wrap)return;
  // כל הפיצ'רים שזמינים למנהל (כולל מודולים) — שיוכל להסתיר מה שלא בשימוש
  var avail=ALL_FEATURES.filter(function(f){return featAvailable(f.k);});
  if(avail.length<=0){wrap.style.display='none';wrap.innerHTML='';return;}
  wrap.style.display='block';
  var h='<div class="card-title" style="margin-top:6px;">⭐ '+T('advFeaturesTitle')+'</div>';
  avail.forEach(function(f){
    h+='<label class="feat-toggle"><span>'+(APP.lang==='ar'?f.ar:f.he)+'</span>'
      +'<input type="checkbox" '+(isFeatureOn(f.k)?'checked':'')+' onchange="toggleUserPref(\''+f.k+'\',this.checked)"></label>';
  });
  wrap.innerHTML=h;
}

function injectLangToggles(){
  document.querySelectorAll('.topbar').forEach(function(tb){
    if(tb.querySelector('.lang-toggle'))return; // כבר קיים
    var d=document.createElement('div');d.className='lang-toggle';
    d.innerHTML='<button class="lang-btn" data-lang="he" onclick="setLang(\'he\')">עב</button><button class="lang-btn" data-lang="ar" onclick="setLang(\'ar\')">عر</button>';
    if(tb.lastElementChild)tb.insertBefore(d,tb.lastElementChild);else tb.appendChild(d);
  });
}
function init(){
  APP.settings=loadJSON('sb_settings',{});
  APP.lang=APP.settings.lang||'he';
  APP.features=loadJSON('dk_features',{supervisorApproval:false,safetyStages:false,customTrades:false});
  APP.userPrefs=loadJSON('dk_user_prefs',{});
  injectLangToggles();
  applyLang();
  applyFeatures();
  if(!isRegistered()){
    // הצג מסך הרשמה
    document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
    document.getElementById('s-register').classList.add('active');
    // סנכרן כפתורי שפה
    document.getElementById('reglang-he').classList.toggle('active',APP.lang==='he');
    document.getElementById('reglang-ar').classList.toggle('active',APP.lang==='ar');
  } else {
    refreshHome();
  }
  getGPS();
  // סנכרון Firebase למשתמש קיים (עדכון lastSeen + משיכת הודעות)
  if(window._dkSync){var s=APP.settings;if(s&&s.managerName)try{window._dkSync({name:s.managerName,phone:s.managerPhone,company:s.companyName,project:s.projectName,lang:s.lang});}catch(e){}}
  maybeShowInstall();
}
// ===== הוספה למסך הבית =====
var _deferredPrompt=null;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();_deferredPrompt=e;});
function isStandalone(){return (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true;}
function maybeShowInstall(){
  if(isStandalone())return;                       // כבר מותקן
  if(loadJSON('dk_install_dismissed',false))return; // המשתמש סגר
  var b=document.getElementById('install-banner');
  if(b){b.style.display='flex';
    // אם יש prompt מקורי (אנדרואיד) — הצג "התקן", אחרת "איך?"
    document.getElementById('install-now-btn').textContent=_deferredPrompt?T('installBtn'):T('installHow');
  }
}
function dismissInstall(){saveJSON('dk_install_dismissed',true);var b=document.getElementById('install-banner');if(b)b.style.display='none';}
function installAction(){
  if(_deferredPrompt){
    _deferredPrompt.prompt();
    _deferredPrompt.userChoice.then(function(){_deferredPrompt=null;dismissInstall();});
    return;
  }
  // ללא prompt (אייפון / לא נתמך) — הצג שלבים לפי מכשיר
  var ua=navigator.userAgent||'';
  var isIos=/iPhone|iPad|iPod/i.test(ua);
  var steps=(isIos?T('installIos'):T('installAndroid')).split('|');
  var h='';for(var i=0;i<steps.length;i+=2){h+='<div class="install-step"><b>'+steps[i]+'</b><span>'+steps[i+1]+'</span></div>';}
  document.getElementById('install-steps').innerHTML=h;
  openModal('modal-install');
}
init();
</script>

<!-- ============ FIREBASE LAYER (ready — paste config to activate) ============ -->
<script type="module">
// כדי להפעיל סנכרון ענן + הודעות מהמשרד: הדבק כאן את firebaseConfig מ-Firebase Console.
// כל עוד ריק — האפליקציה עובדת רגיל (localStorage בלבד), ללא הודעות.
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyBuMvbL1XvjyF2dFPQyx-orcISYNuc1RqA",
  authDomain: "siteboss-b2dd2.firebaseapp.com",
  projectId: "siteboss-b2dd2",
  storageBucket: "siteboss-b2dd2.firebasestorage.app",
  messagingSenderId: "217365148122",
  appId: "1:217365148122:web:000bcf98af028eb98210e3"
};

if (FIREBASE_CONFIG && FIREBASE_CONFIG.projectId) {
  import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js").then(async function(appMod){
    const fsMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    const app = appMod.initializeApp(FIREBASE_CONFIG);
    const db = fsMod.getFirestore(app);
    // הזדהות אנונימית — חובה לפני קריאה/כתיבה (כללי האבטחה דורשים auth).
    // ממתינים לסיום ההזדהות לפני הקמת מאזין ההודעות, אחרת המאזין נכשל בשקט.
    try{const authMod=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");const auth=authMod.getAuth(app);await new Promise(function(res){authMod.signInAnonymously(auth).then(function(){res();}).catch(function(){res();});authMod.onAuthStateChanged(auth,function(u){if(u)res();});setTimeout(res,4000);});}catch(e){}
    const { doc, setDoc, deleteDoc, collection, query, orderBy, onSnapshot, getDocs, getDoc } = fsMod;

    // רישום / עדכון מנהל (id = טלפון מנוקה)
    function upsert(data){
      var id = (data.phone||'').replace(/\D/g,'') || ('u'+Date.now());
      return setDoc(doc(db,'managers',id), Object.assign({}, data, { lastSeen: new Date().toISOString() }), { merge:true });
    }
    window._dkRegister = upsert;
    window._dkSync = upsert;
    // סנכרון אוטומטי של המשתמש הרשום ברגע ש-Firebase מוכן (פותר מקרה שבו init רץ לפני שהמודול נטען)
    try{ var _st=JSON.parse(localStorage.getItem('sb_settings')||'{}'); if(_st&&_st.managerName){ upsert({name:_st.managerName,phone:_st.managerPhone,company:_st.companyName,project:_st.projectName,lang:_st.lang||'he'}); } }catch(e){}

    // שמירת/מחיקת רשומה (יומן/ליקוי/בטיחות) ב-Firestore — משויך למנהל
    window._dkSaveDoc = function(coll, id, data){
      try{ return setDoc(doc(db, coll, String(id)), data, { merge:true }).catch(function(){}); }catch(e){ return Promise.resolve(); }
    };
    window._dkDeleteDoc = function(coll, id){
      try{ return deleteDoc(doc(db, coll, String(id))).catch(function(){}); }catch(e){ return Promise.resolve(); }
    };
    // העלאת תמונות ל-Firebase Storage → מחזיר מערך כתובות
    try{
      const stMod = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js");
      const storage = stMod.getStorage(app);
      window._dkUploadPhotos = async function(pathBase, dataUrls){
        if(!dataUrls||!dataUrls.length) return [];
        var urls=[];
        for(var i=0;i<dataUrls.length;i++){
          try{ var r=stMod.ref(storage, pathBase+'/'+i+'.jpg'); await stMod.uploadString(r, dataUrls[i], 'data_url'); urls.push(await stMod.getDownloadURL(r)); }catch(e){}
        }
        return urls;
      };
    }catch(e){}

    // משיכת הפיצ'רים שהבעלים הדליק למנהל + האזנה חיה לשינויים
    function myPhoneId(){try{return(JSON.parse(localStorage.getItem('sb_settings')||'{}').managerPhone||'').replace(/\D/g,'');}catch(e){return '';}}
    function applyMgrFeatures(){
      var id=myPhoneId(); if(!id) return;
      try{ onSnapshot(doc(db,'managers',id), function(snap){
        if(snap.exists()){ var d=snap.data(); if(window._dkOnFeatures) window._dkOnFeatures(d.features||{}); }
      }, function(){}); }catch(e){}
      // משיכה חד-פעמית עמידה
      (function fetchFeat(t){ getDoc(doc(db,'managers',id)).then(function(s){ if(s.exists()&&window._dkOnFeatures)window._dkOnFeatures((s.data()||{}).features||{}); }).catch(function(){ if(t<5)setTimeout(function(){fetchFeat(t+1);},1500); }); })(0);
    }
    applyMgrFeatures();
    // תדריכי בטיחות מותאמים מהמשרד
    try{ onSnapshot(doc(db,'config','briefings'), function(snap){ if(snap.exists()&&window._dkOnBriefings)window._dkOnBriefings(snap.data()||{}); }, function(){}); }catch(e){}

    // האזנה להודעות מהמשרד
    var qy = query(collection(db,'messages'), orderBy('createdAt','desc'));
    function myPhoneDigits(){try{return(JSON.parse(localStorage.getItem('sb_settings')||'{}').managerPhone||'').replace(/\D/g,'');}catch(e){return '';}}
    function processSnap(snap){
      var myPhone = myPhoneDigits();
      if(!myPhone) return; // עדיין אין טלפון — נחכה לקריאה הבאה
      var msgs=[];
      snap.forEach(function(d){
        var m=d.data();
        var aud=m.audience;
        var forMe = aud==='all' || (Array.isArray(aud) && aud.indexOf(myPhone)>=0);
        if(!forMe) return;
        var ts = m.createdAt && m.createdAt.toDate ? m.createdAt.toDate().getTime() : Date.now();
        msgs.push({ ts:ts, title:m.title||'', body:m.body||'', link:m.link||'' });
      });
      if(window._dkOnMessages) window._dkOnMessages(msgs);
    }
    // שליפה עמידה — מנסה שוב עד שמצליחה (אימות/רשת עשויים להתעכב)
    var _fetchedOk=false;
    window._dkFetchMessages = function(tries){
      tries=tries||0;
      return getDocs(qy).then(function(snap){ _fetchedOk=true; processSnap(snap); })
        .catch(function(){ if(tries<8) setTimeout(function(){window._dkFetchMessages(tries+1);}, 1500); });
    };
    window._dkFetchMessages(0);
    // מאזין חי לעדכונים בזמן אמת בזמן שהאפליקציה פתוחה
    onSnapshot(qy, function(snap){ if(!snap.metadata.fromCache) processSnap(snap); }, function(){
      // אם המאזין נכשל (הרשאה לפני אימות) — נסמוך על השליפה החוזרת
      if(!_fetchedOk) setTimeout(function(){window._dkFetchMessages(0);}, 1500);
    });
  }).catch(function(e){ console.error('Firebase load failed', e); });
}
</script>
