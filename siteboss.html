<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a73e8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SiteBoss">
<title>SiteBoss — ניהול אתר בנייה</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ===== ערכת עיצוב Hi-Tech v0.3 — לבן נקי, דיו נייבי עמוק, אקסנט חשמלי יחיד (#6161FF). בלי גרדיאנטים, צללים מינימליים. ===== */
:root{
  --navy:#0A1A2F;        /* primary ink */
  --accent:#6161FF;      /* האקסנט היחיד — CTA/קישורים/מיקוד */
  --accent-d:#4B4BE0;    /* hover/עומק */
  --surface:#FFFFFF;     /* קנבס */
  --container:#F4F6FA;   /* surface-container — כרטיסים במקום צל */
  /* תאימות-לאחור לשמות הישנים (כל הקוד ממשיך לעבוד) */
  --blue:#6161FF;--blue-d:#0A1A2F;--blue-bg:#ECECFF;
  --bg:#FFFFFF;--card:#F4F6FA;--text:#0A1A2F;--sub:#5C6B82;--border:#E2E7F0;
  /* צבעי סטטוס לבטיחות בלבד — מאופקים, מינימליים */
  --green:#1f9d57;--orange:#e67e22;--red:#e03131;
}
/* נגישות: מסגרת מיקוד ברורה לניווט מקלדת/קורא מסך */
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.icon-btn:focus-visible,.status-btn:focus-visible,.home-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;box-shadow:0 0 0 4px rgba(97,97,255,.16);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:'Heebo','Segoe UI',Arial,Tahoma,sans-serif;background:#E6EAF1;color:var(--text);font-size:16px;-webkit-text-size-adjust:100%;font-feature-settings:'kern','calt';}
body{display:flex;justify-content:center;}
#app{max-width:480px;width:100%;min-height:100vh;background:var(--surface);position:relative;box-shadow:0 0 40px rgba(10,26,47,.10);display:flex;flex-direction:column;overflow:hidden;}
.screen{display:none;flex-direction:column;flex:1;overflow:hidden;}
.screen.active{display:flex;}
.screen-body{flex:1;overflow-y:auto;padding:16px;padding-bottom:calc(90px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;}
.topbar{min-height:62px;background:var(--navy);color:white;display:flex;align-items:center;padding:0 12px;gap:8px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.08);padding-top:env(safe-area-inset-top);position:relative;z-index:5;}
.topbar-center{flex:1;text-align:center;min-width:0;}
.topbar-title{font-family:'Space Grotesk','Heebo',sans-serif;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em;}
.topbar-sub{font-size:11px;opacity:.85;margin-top:1px;}
.icon-btn{width:46px;height:46px;border:none;background:rgba(255,255,255,.14);color:white;border-radius:8px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.icon-btn:active{background:rgba(255,255,255,.28);}
.back-btn{display:flex;align-items:center;gap:5px;height:46px;padding:0 16px;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);color:white;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;flex-shrink:0;font-family:inherit;}
.back-btn:active{background:rgba(255,255,255,.4);}
#bottom-back{display:none;padding:6px 16px calc(14px + env(safe-area-inset-bottom));}
#bottom-back button{width:100%;min-height:50px;border:2px solid var(--blue);background:#eaf1fb;color:var(--blue-d);border-radius:14px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;}
#bottom-back button:active{background:#d9e6f7;}
#install-banner{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -4px 12px rgba(10,26,47,.12);z-index:80;}
.install-step{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;}
.install-step b{background:var(--blue);color:#fff;min-width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;}
.lang-toggle{display:flex;gap:3px;}
.lang-btn{padding:4px 9px;border-radius:8px;border:1px solid rgba(255,255,255,.3);background:transparent;color:rgba(255,255,255,.7);font-size:12px;font-weight:700;cursor:pointer;}
.lang-btn.active{background:white;color:var(--blue-d);}
.card{background:var(--container);border-radius:12px;border:none;padding:20px;margin-bottom:14px;}
.card-title{font-size:16px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:7px;}
input,textarea,select{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:16px;color:var(--text);background:var(--surface);outline:none;}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(97,97,255,.16);}
textarea{resize:vertical;min-height:100px;line-height:1.6;}
label{display:block;font-size:14px;font-weight:700;color:var(--text);margin-bottom:6px;}
.form-group{margin-bottom:14px;}
.btn{min-height:54px;border:none;border-radius:8px;font-family:inherit;font-size:17px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:0 18px;position:relative;transition:background .15s,transform .1s;}
.btn::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;}
.btn:active{transform:scale(.98);}
.btn-blue{background:var(--accent);color:#fff;}
.btn-blue:active{background:var(--navy);}
.btn-green{background:var(--green);color:white;}
.btn-red{background:var(--red);color:white;}
.btn-gray{background:var(--container);color:var(--navy);border:1px solid var(--border);}
.btn-outline{background:var(--surface);border:1px solid var(--navy);color:var(--navy);}
.btn-sm{min-height:38px;font-size:13px;border-radius:8px;padding:0 14px;width:auto;}
/* כפתורי בית — סגנון Hi-Tech: כרטיס surface-container, דיו נייבי, אריח אייקון באקסנט. בלי גרדיאנט, בלי צבע מלא. */
.home-btn{border-radius:12px;padding:16px;text-align:right;border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;gap:14px;width:100%;margin-bottom:12px;background:var(--container)!important;color:var(--navy);position:relative;overflow:hidden;min-height:88px;}
.home-btn::before{content:none;}
.home-btn:active{transform:scale(.985);background:#ECEEF5!important;}
.home-btn-icon{font-size:34px;flex-shrink:0;width:58px;height:58px;border-radius:10px;background:rgba(97,97,255,.10);display:flex;align-items:center;justify-content:center;}
.home-btn-texts{flex:1;min-width:0;}
.home-btn-title{font-size:19px;font-weight:800;display:block;margin-bottom:3px;color:var(--navy);}
.home-btn-desc{font-size:13px;color:var(--sub);display:block;line-height:1.45;}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px;}
.stat-card{background:var(--container);border:none;border-radius:12px;padding:16px 8px;text-align:center;cursor:pointer;}
.stat-card:active{transform:scale(.97);}
.stat-num{font-family:'Space Grotesk','Heebo',sans-serif;font-size:30px;font-weight:700;color:var(--accent);line-height:1;}
#stat-defects{color:var(--navy);}#stat-safety{color:var(--navy);}
.stat-label{font-size:12px;color:var(--sub);font-weight:500;margin-top:6px;}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.workers-table{width:100%;border-collapse:collapse;font-size:14px;}
.workers-table th{background:var(--bg);padding:8px 10px;text-align:right;font-size:12px;font-weight:700;color:var(--sub);border-bottom:1px solid var(--border);}
.workers-table td{padding:6px 10px;border-bottom:1px solid var(--border);vertical-align:middle;}
.workers-table td input{padding:6px 8px;font-size:14px;text-align:center;min-height:36px;}
.workers-table tr.total-row td{font-weight:700;background:#f8fafc;}
.weather-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
.weather-btn{border:2px solid var(--border);border-radius:10px;padding:8px 4px;text-align:center;cursor:pointer;background:white;}
.weather-btn.active{border-color:var(--blue);background:#e8f0fe;}
.w-icon{font-size:22px;display:block;}
.w-label{font-size:10px;font-weight:600;color:var(--sub);margin-top:3px;display:block;}
.photos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.photo-thumb{aspect-ratio:1;border-radius:10px;overflow:hidden;position:relative;}
.photo-thumb img{width:100%;height:100%;object-fit:cover;}
.photo-add{border:2px dashed var(--border);border-radius:10px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:var(--bg);gap:4px;color:var(--sub);font-size:12px;font-weight:600;}
.photo-add-icon{font-size:28px;}
.photo-del{position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:rgba(231,76,60,.85);color:white;border:none;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.defect-card{border-radius:14px;border:1px solid var(--border);padding:14px;margin-bottom:10px;background:white;}
.sev-urgent{border-right:4px solid var(--red);}
.sev-normal{border-right:4px solid var(--orange);}
.sev-low{border-right:4px solid var(--green);}
.defect-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.defect-desc{font-size:15px;font-weight:700;flex:1;}
.sev-badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap;}
.sev-badge.urgent{background:#fdecea;color:var(--red);}
.sev-badge.normal{background:#fef3e7;color:var(--orange);}
.sev-badge.low{background:#eafaf1;color:var(--green);}
.defect-meta{font-size:12px;color:var(--sub);margin-bottom:10px;}
.defect-meta span{margin-inline-end:10px;}
.defect-actions{display:flex;gap:6px;flex-wrap:wrap;}
.fix-panel{background:#eafaf1;border:1.5px solid #a9dfbf;border-radius:10px;padding:12px 14px;margin:10px 0 6px;}
.fix-panel-title{font-size:14px;font-weight:800;color:var(--green);margin-bottom:8px;}
.fix-row{display:flex;gap:8px;font-size:13px;margin-bottom:4px;align-items:flex-start;}
.fix-lbl{color:var(--sub);min-width:90px;flex-shrink:0;font-weight:600;}
.btn-fix-main{flex:1;padding:9px 12px;border-radius:8px;border:none;background:var(--green);color:white;font-size:14px;font-weight:800;cursor:pointer;min-width:120px;}
.btn-fix-main:active{opacity:.8;}
.photo-add-btn{display:flex;align-items:center;gap:8px;padding:12px 16px;border:2px dashed #bdc3c7;border-radius:10px;cursor:pointer;font-size:15px;color:var(--sub);background:#fafafa;}
.status-btn{padding:10px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--navy);font-size:14px;font-weight:700;cursor:pointer;}
.status-btn.active-open{background:#fdecea;border-color:var(--red);color:var(--red);}
.status-btn.active-progress{background:#fef3e7;border-color:var(--orange);color:var(--orange);}
.status-btn.active-done{background:#eafaf1;border-color:var(--green);color:var(--green);}
.filter-tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px;}
.filter-tab{padding:9px 16px;border-radius:999px;border:1px solid var(--border);background:var(--surface);font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;color:var(--sub);}
.filter-tab.active{background:var(--navy);border-color:var(--navy);color:white;}
.work-type-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.work-type-btn{padding:14px;border-radius:12px;border:2px solid var(--border);background:white;text-align:center;cursor:pointer;}
.work-type-btn.active{border-color:var(--red);background:#fdf0ef;}
.work-type-icon{font-size:28px;display:block;margin-bottom:4px;}
.work-type-label{font-size:14px;font-weight:800;}
.work-type-count{display:block;font-size:11px;font-weight:700;color:var(--sub);margin-top:3px;}
.work-type-btn.active .work-type-count{color:var(--red);}
.stage-card{background:#f4f8fc;border:1px dashed #b9cce0;}
.stage-card-title{font-size:15px;font-weight:800;color:var(--blue-d);margin-bottom:3px;}
.stage-hint{font-size:12px;color:var(--sub);margin-bottom:12px;}
.stage-chips{display:flex;gap:8px;flex-wrap:wrap;}
.stage-chip{display:flex;align-items:center;gap:6px;padding:9px 13px;border-radius:22px;border:2px solid var(--border);background:white;font-size:14px;font-weight:700;cursor:pointer;color:var(--text);}
.stage-chip-i{font-size:18px;}
.stage-chip.on{border-color:var(--accent);background:#fff4d9;color:#7a5800;}
.fb-type{flex:1;text-align:center;padding:11px 6px;border:2px solid var(--border);border-radius:10px;background:white;font-size:14px;font-weight:700;cursor:pointer;color:var(--sub);}
.fb-type.active{border-color:var(--blue);background:#e8f0fe;color:var(--blue);}
.feat-toggle{display:flex;justify-content:space-between;align-items:center;padding:11px 4px;border-bottom:1px solid var(--border);font-size:15px;font-weight:600;}
.feat-toggle input{width:46px;height:26px;cursor:pointer;}
.faq-item{border-bottom:1px solid var(--border);padding:2px 0;}
.faq-q{padding:12px 4px;font-size:15px;font-weight:700;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center;}
.faq-q .arr{color:var(--sub);transition:transform .2s;flex-shrink:0;}
.faq-item.open .faq-q .arr{transform:rotate(90deg);}
.faq-a{font-size:14px;color:var(--sub);line-height:1.6;padding:0 4px 12px;display:none;}
.faq-item.open .faq-a{display:block;}
.stage-chip-x{background:var(--accent);color:#3d2c00;width:18px;height:18px;border-radius:50%;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;}
.safety-question.special{border-color:var(--accent);background:#fff8e8;}
.sq-special-tag{display:inline-block;background:var(--accent);color:#3d2c00;font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;margin-bottom:8px;}
.safety-question{background:white;border:1.5px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;}
.safety-question.passed{border-color:var(--green);background:#f0faf4;}
.safety-question.failed{border-color:var(--red);background:#fff5f5;}
.sq-text{font-size:16px;font-weight:700;margin-bottom:10px;line-height:1.5;}
.sq-alert{font-size:12px;color:var(--red);font-weight:700;margin-top:6px;display:none;}
.safety-question.failed .sq-alert{display:block;}
.sq-btns{display:flex;gap:10px;}
.sq-btn{flex:1;min-height:56px;border-radius:11px;border:2px solid var(--border);background:white;font-size:17px;font-weight:800;cursor:pointer;}
.sq-btn.ok{background:var(--green);border-color:var(--green);color:white;}
.sq-btn.fail{background:var(--red);border-color:var(--red);color:white;}
#sign-canvas,#jnl-sign-canvas,#sup-sign-canvas,#ob-sign-canvas,#perm-sign-canvas{border:2px solid var(--border);border-radius:12px;width:100%;height:110px;background:white;cursor:crosshair;touch-action:none;}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:#2c3e50;color:white;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:all .3s;pointer-events:none;z-index:9999;max-width:90%;text-align:center;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;display:flex;align-items:flex-end;justify-content:center;}
.modal-overlay.hidden{display:none;}
.modal-sheet{background:white;border-radius:20px 20px 0 0;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding:20px;}
.modal-title{font-size:17px;font-weight:800;margin-bottom:16px;}
.modal-actions{display:flex;gap:10px;margin-top:16px;}
.history-item{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer;}
.history-item-date{font-size:15px;font-weight:700;}
.history-item-sub{font-size:12px;color:var(--sub);margin-top:3px;}
.report-container{padding:24px 22px;font-size:14px;line-height:1.7;color:#1b2733;background:#fff;}
.report-logo{text-align:center;margin-bottom:18px;padding-bottom:14px;border-bottom:3px solid var(--accent);}
.report-logo-title{font-size:28px;font-weight:900;color:var(--blue-d);letter-spacing:1.5px;}
.report-logo-sub{font-size:12px;color:var(--sub);margin-top:3px;}
.report-header{background:#f4f7fb;border:1px solid #e2e9f0;border-radius:10px;padding:14px 16px;margin-bottom:16px;}
.report-header p{margin-bottom:5px;font-size:13.5px;}
.report-header p:last-child{margin-bottom:0;}
.report-section-title{font-size:15px;font-weight:800;border-right:5px solid var(--blue);background:#eef3fa;padding:7px 12px;border-radius:7px;margin:18px 0 10px;color:var(--blue-d);}
.report-sq-row{display:flex;justify-content:space-between;align-items:center;padding:7px 4px;border-bottom:1px solid #eef1f5;font-size:13px;break-inside:avoid;}
.report-ok{color:var(--green);font-weight:700;}
.report-fail{color:var(--red);font-weight:700;}
.report-sign-box{border:2px solid var(--border);border-radius:10px;padding:10px;margin-top:8px;}
.report-footer{text-align:center;font-size:11px;color:var(--sub);margin-top:20px;padding-top:10px;border-top:1px solid var(--border);}
.offline-note{text-align:center;font-size:11px;color:var(--sub);padding:8px;border-top:1px solid var(--border);flex-shrink:0;}
.contractor-item{display:flex;justify-content:space-between;align-items:center;padding:12px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;}
.contractor-info .c-name{font-size:14px;font-weight:700;}
.contractor-info .c-meta{font-size:12px;color:var(--sub);}
.contractor-del{width:32px;height:32px;border-radius:8px;border:none;background:#fdecea;color:var(--red);font-size:16px;cursor:pointer;}
.fab{position:fixed;bottom:80px;left:16px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:white;font-size:28px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(97,97,255,.30);z-index:100;}
/* REGISTRATION */
#s-register{overflow-y:auto;-webkit-overflow-scrolling:touch;}
.register-hero{background:var(--navy);padding:36px 24px 44px;text-align:center;color:white;flex-shrink:0;}
.register-logo{font-size:42px;font-weight:900;letter-spacing:2px;margin-bottom:8px;}
.register-tagline{font-size:13px;opacity:.85;}
.register-body{background:white;border-radius:24px 24px 0 0;margin-top:-18px;padding:28px 20px 50px;}
.register-welcome{font-size:22px;font-weight:900;color:var(--text);margin-bottom:4px;}
.register-sub{font-size:14px;color:var(--sub);margin-bottom:24px;}
.reg-lang-row{display:flex;gap:10px;margin-top:4px;}
.reg-lang-btn{flex:1;padding:12px;border-radius:12px;border:2px solid #dce3e9;background:white;text-align:center;font-size:15px;font-weight:700;cursor:pointer;color:var(--sub);transition:all .2s;}
.reg-lang-btn.active{border-color:var(--blue);background:var(--blue-bg);color:var(--blue);}
.reg-submit{margin-top:8px;padding:16px;font-size:17px;letter-spacing:.5px;}
.reg-note{text-align:center;font-size:12px;color:var(--sub);margin-top:14px;opacity:.7;}
.btn-fix-sm{padding:5px 10px;border-radius:8px;border:none;background:#e67e22;color:white;font-size:12px;font-weight:700;cursor:pointer;margin-top:6px;}
.safety-fix-panel{background:#eafaf1;border:1.5px solid #a9dfbf;border-radius:10px;padding:10px 12px;margin-top:8px;}
.safety-fix-panel-title{font-size:13px;font-weight:800;color:var(--green);margin-bottom:6px;}
@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}
  .topbar,.offline-note,.no-print,#bottom-back{display:none!important;}
  .screen-body{padding:0!important;overflow:visible!important;}
  #app{box-shadow:none!important;max-width:100%!important;}
  .report-container{padding:0!important;}
  @page{margin:14mm;}
}
</style>
</head>
<body>
<div id="app">
<!-- HOME -->
<!-- REGISTRATION SCREEN -->
<div class="screen" id="s-register">
  <div class="register-hero">
    <div class="register-logo">SiteBoss</div>
    <div class="register-tagline" data-t="appTagline"></div>
  </div>
  <div class="register-body">
    <div class="register-welcome" data-t="regWelcome"></div>
    <div class="register-sub" data-t="regSub"></div>

    <div class="form-group">
      <label class="form-label" data-t="regFullName"></label>
      <input id="reg-name" type="text" class="form-input" data-tp="regFullNamePh" autocomplete="name">
    </div>
    <div class="form-group">
      <label class="form-label" data-t="regPhone"></label>
      <input id="reg-phone" type="tel" class="form-input" placeholder="05X-XXXXXXX" autocomplete="tel">
    </div>
    <div class="form-group">
      <label class="form-label" data-t="regCompany"></label>
      <input id="reg-company" type="text" class="form-input" data-tp="regCompanyPh" autocomplete="organization">
    </div>
    <div class="form-group">
      <label class="form-label" data-t="regProject"></label>
      <input id="reg-project" type="text" class="form-input" data-tp="regProjectPh">
    </div>
    <div class="form-group">
      <label class="form-label" data-t="regLang"></label>
      <div class="reg-lang-row">
        <div class="reg-lang-btn active" id="reglang-he" onclick="setRegLang('he')">🇮🇱 עברית</div>
        <div class="reg-lang-btn" id="reglang-ar" onclick="setRegLang('ar')">🇵🇸 عربية</div>
      </div>
    </div>

    <button class="btn btn-green reg-submit" onclick="submitRegistration()">
      <span data-t="regSubmit"></span>
    </button>

    <div style="text-align:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--border);">
      <div style="font-size:13px;color:var(--sub);margin-bottom:8px;" data-t="regReturning"></div>
      <button onclick="restoreByPhone()" style="background:none;border:2px solid var(--blue);color:var(--blue);border-radius:10px;padding:10px 18px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;" data-t="regRestoreBtn"></button>
    </div>

    <div class="reg-note" data-t="regNote"></div>
  </div>
</div>

<div class="screen active" id="s-home">
  <div class="topbar">
    <div style="width:40px"></div>
    <div class="topbar-center"><div class="topbar-title">SiteBoss</div><div class="topbar-sub" data-t="appTagline"></div></div>
    <div style="display:flex;gap:6px;align-items:center">
      <div class="lang-toggle"><button class="lang-btn" data-lang="he" onclick="setLang('he')">עב</button><button class="lang-btn" data-lang="ar" onclick="setLang('ar')">عر</button></div>
      <button class="icon-btn" aria-label="הגדרות / الإعدادات" onclick="showScreen('s-settings')">⚙️</button>
    </div>
  </div>
  <div class="screen-body">
    <div id="msg-banner" onclick="showScreen('s-messages')" style="display:none;background:var(--accent);color:#fff;border-radius:12px;padding:13px 15px;margin-bottom:14px;cursor:pointer;align-items:center;gap:10px;">
      <span style="font-size:22px;">📢</span>
      <div style="flex:1;"><div style="font-weight:800;font-size:14px;" id="msg-banner-title"></div><div style="font-size:12px;opacity:.9;" id="msg-banner-sub"></div></div>
      <span style="background:#fff;color:var(--accent);border-radius:20px;min-width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;padding:0 7px;" id="msg-banner-count">0</span>
    </div>
    <div id="home-banner" style="background:var(--container);border:none;border-right:4px solid var(--accent);border-radius:12px;padding:14px 16px;margin-bottom:14px;cursor:pointer;display:flex;align-items:center;gap:12px;" onclick="showScreen('s-settings')">
      <span style="font-size:26px;">🏗️</span>
      <div style="flex:1;min-width:0;">
        <div id="home-project-name" style="font-size:17px;font-weight:800;"></div>
        <div id="home-manager-name" style="font-size:13px;color:var(--sub);margin-top:2px;"></div>
      </div>
      <span style="color:var(--sub);font-size:20px;">⚙️</span>
    </div>
    <div class="stats-row">
      <div class="stat-card" onclick="showScreen('s-journal-history')"><div class="stat-num" id="stat-journal">0</div><div class="stat-label" data-t="statJournal"></div></div>
      <div class="stat-card" onclick="showScreen('s-defects')"><div class="stat-num" id="stat-defects">0</div><div class="stat-label" data-t="statOpen"></div></div>
      <div class="stat-card" onclick="showScreen('s-safety-history')"><div class="stat-num" id="stat-safety">0</div><div class="stat-label" data-t="statSafety"></div></div>
    </div>
    <button id="home-digest-btn" onclick="sendDailyDigest()" style="width:100%;margin:0 0 14px;padding:13px;border:1.5px solid var(--accent);border-radius:10px;background:var(--container);color:var(--accent);font-weight:800;font-size:15px;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;" data-t="digestBtn"></button>
    <button id="home-mod-journal" class="home-btn" style="background:linear-gradient(135deg,#1f9d57,#157a42);" onclick="showScreen('s-journal')">
      <span class="home-btn-icon">📋</span>
      <span class="home-btn-texts"><span class="home-btn-title" data-t="btn1Title"></span><span class="home-btn-desc" data-t="btn1Desc"></span></span>
    </button>
    <button id="home-mod-defects" class="home-btn" style="background:linear-gradient(135deg,#e67e22,#c0641a);" onclick="showScreen('s-defects')">
      <span class="home-btn-icon">📸</span>
      <span class="home-btn-texts"><span class="home-btn-title" data-t="btn2Title"></span><span class="home-btn-desc" data-t="btn2Desc"></span></span>
    </button>
    <button id="home-mod-safety" class="home-btn" style="background:linear-gradient(135deg,#e03131,#b32020);" onclick="showScreen('s-safety')">
      <span class="home-btn-icon">🦺</span>
      <span class="home-btn-texts"><span class="home-btn-title" data-t="btn3Title"></span><span class="home-btn-desc" data-t="btn3Desc"></span></span>
    </button>
    <button id="home-mod-presence" class="home-btn" style="display:none;background:linear-gradient(135deg,#2980b9,#1c5fb0);" onclick="showScreen('s-presence')">
      <span class="home-btn-icon">👷</span>
      <span class="home-btn-texts"><span class="home-btn-title" data-t="btn4Title"></span><span class="home-btn-desc" data-t="btn4Desc"></span></span>
    </button>
    <button id="home-mod-reminders" class="home-btn" style="display:none;background:linear-gradient(135deg,#8e44ad,#6c3483);" onclick="showScreen('s-reminders')">
      <span class="home-btn-icon">⏰</span>
      <span class="home-btn-texts"><span class="home-btn-title" data-t="btn5Title"></span><span class="home-btn-desc" data-t="btn5Desc"></span><span id="rem-home-badge" style="display:none;background:rgba(255,255,255,.3);border-radius:10px;padding:1px 8px;font-size:12px;font-weight:800;margin-top:4px;display:inline-block;"></span></span>
    </button>
    <button id="home-mod-incidents" class="home-btn" style="display:none;background:linear-gradient(135deg,#34495e,#222f3d);" onclick="showScreen('s-incidents')">
      <span class="home-btn-icon">🚨</span>
      <span class="home-btn-texts"><span class="home-btn-title" data-t="btn6Title"></span><span class="home-btn-desc" data-t="btn6Desc"></span></span>
    </button>
    <button id="home-mod-onboard" class="home-btn" style="display:none;background:linear-gradient(135deg,#16a085,#0e6655);" onclick="showScreen('s-onboard')">
      <span class="home-btn-icon">🪪</span>
      <span class="home-btn-texts"><span class="home-btn-title" data-t="btn7Title"></span><span class="home-btn-desc" data-t="btn7Desc"></span></span>
    </button>
    <button id="home-mod-contractors" class="home-btn" style="display:none;background:linear-gradient(135deg,#7f8c8d,#5d6d7e);" onclick="showScreen('s-contractors')">
      <span class="home-btn-icon">🏢</span>
      <span class="home-btn-texts"><span class="home-btn-title" data-t="btn8Title"></span><span class="home-btn-desc" data-t="btn8Desc"></span></span>
    </button>
    <button id="home-mod-permits" class="home-btn" style="display:none;background:linear-gradient(135deg,#d35400,#a04000);" onclick="showScreen('s-permits')">
      <span class="home-btn-icon">📋</span>
      <span class="home-btn-texts"><span class="home-btn-title" data-t="btn9Title"></span><span class="home-btn-desc" data-t="btn9Desc"></span></span>
    </button>
    <button id="home-mod-equipment" class="home-btn" style="display:none;background:linear-gradient(135deg,#0e7490,#0b5563);" onclick="showScreen('s-equipment')">
      <span class="home-btn-icon">🚜</span>
      <span class="home-btn-texts"><span class="home-btn-title" data-t="btnEqTitle"></span><span class="home-btn-desc" data-t="btnEqDesc"></span></span>
    </button>
    <button id="home-mod-expert" class="home-btn" style="background:linear-gradient(135deg,#5b3fb0,#3d2880);" onclick="showScreen('s-expert')">
      <span class="home-btn-icon">🧠</span>
      <span class="home-btn-texts"><span class="home-btn-title" data-t="btnExpTitle"></span><span class="home-btn-desc" data-t="btnExpDesc"></span></span>
    </button>
  </div>
  <div style="text-align:center;margin-top:18px;display:flex;gap:16px;justify-content:center;flex-wrap:wrap;">
    <button onclick="showScreen('s-help')" style="background:none;border:none;color:var(--blue);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;text-decoration:underline;" data-t="helpLink"></button>
    <button onclick="showScreen('s-legal')" style="background:none;border:none;color:var(--sub);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;text-decoration:underline;" data-t="legalLink"></button>
  </div>
  <div class="offline-note" data-t="offlineNote"></div>
</div>

<!-- MESSAGES INBOX -->
<div class="screen" id="s-messages">
  <div class="topbar">
    <button class="back-btn" onclick="showScreen('s-home')">→ <span data-t="backLabel"></span></button>
    <div class="topbar-center"><div class="topbar-title" data-t="msgInboxTitle"></div></div>
    <div style="width:40px"></div>
  </div>
  <div class="screen-body"><div id="messages-list"></div></div>
</div>

<!-- EXPERT AI ASSISTANT -->
<div class="screen" id="s-expert">
  <div class="topbar">
    <button class="back-btn" onclick="showScreen('s-home')">→ <span data-t="backLabel"></span></button>
    <div class="topbar-center"><div class="topbar-title" data-t="expTitle"></div></div>
    <div style="width:40px"></div>
  </div>
  <div class="screen-body" style="display:flex;flex-direction:column;height:calc(100vh - 64px);padding-bottom:0;">
    <div id="exp-chips" style="display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;-webkit-overflow-scrolling:touch;"></div>
    <div id="exp-log" style="flex:1;overflow-y:auto;padding:4px 2px;"></div>
    <div style="display:flex;align-items:flex-end;gap:8px;padding:10px 2px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--border);">
      <textarea id="exp-input" rows="1" data-tp="expPlaceholder" style="flex:1 1 auto;width:100%;min-width:0;min-height:54px;max-height:120px;resize:none;font-size:16px;padding:14px 12px;border-radius:12px;border:1.5px solid var(--border);font-family:inherit;box-sizing:border-box;"></textarea>
      <button class="btn btn-blue" style="flex:0 0 54px;width:54px;min-width:0;font-size:22px;padding:0;" onclick="sendExpert()">↑</button>
    </div>
  </div>
</div>

<!-- LEGAL: תנאי שימוש ופרטיות -->
<div class="screen" id="s-legal">
  <div class="topbar">
    <button class="back-btn" onclick="showScreen('s-home')">→ <span data-t="backLabel"></span></button>
    <div class="topbar-center"><div class="topbar-title" data-t="legalTitle"></div></div>
    <div style="width:40px"></div>
  </div>
  <div class="screen-body"><div id="legal-body" style="line-height:1.7;font-size:14px;"></div></div>
</div>

<!-- HELP & FEEDBACK -->
<div class="screen" id="s-help">
  <div class="topbar">
    <button class="back-btn" onclick="showScreen('s-home')">→ <span data-t="backLabel"></span></button>
    <div class="topbar-center"><div class="topbar-title" data-t="helpTitle"></div></div>
    <div style="width:40px"></div>
  </div>
  <div class="screen-body">
    <div class="card">
      <div class="card-title" data-t="faqTitle"></div>
      <div id="faq-list"></div>
    </div>
    <div class="card">
      <div class="card-title" data-t="feedbackTitle"></div>
      <div id="feedback-ref" style="display:none;background:var(--blue-bg,#e8f0fe);border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:10px;color:var(--blue-d);"></div>
      <div class="form-group">
        <label data-t="feedbackType"></label>
        <div class="weather-row" style="display:flex;gap:8px;">
          <div class="fb-type active" data-fb="bug" onclick="selFbType('bug')">🐞 <span data-t="fbBug"></span></div>
          <div class="fb-type" data-fb="idea" onclick="selFbType('idea')">💡 <span data-t="fbIdea"></span></div>
          <div class="fb-type" data-fb="question" onclick="selFbType('question')">❓ <span data-t="fbQuestion"></span></div>
        </div>
      </div>
      <div class="form-group">
        <label data-t="feedbackText"></label>
        <textarea id="fb-text" data-tp="feedbackPlaceholder" rows="4"></textarea>
      </div>
      <button class="btn btn-green" onclick="submitFeedback()"><span data-t="feedbackSend"></span></button>
    </div>
  </div>
</div>

<!-- PRESENCE (#11) -->
<div class="screen" id="s-presence">
  <div class="topbar">
    <button class="back-btn" onclick="showScreen('s-home')">→ <span data-t="backLabel"></span></button>
    <div class="topbar-center"><div class="topbar-title" data-t="presTitle"></div><div class="topbar-sub" id="pres-date-sub"></div></div>
    <button class="icon-btn" aria-label="היסטוריה / السجل" onclick="showScreen('s-presence-history')">📂</button>
  </div>
  <div class="screen-body">
    <div class="card" style="text-align:center;background:var(--blue-bg,#e8f0fe);border:none;">
      <div style="font-size:13px;color:var(--sub);font-weight:700;" data-t="presOnSite"></div>
      <div style="font-size:42px;font-weight:900;color:var(--blue);line-height:1.1;" id="pres-count">0</div>
    </div>
    <button class="btn btn-outline" style="margin-bottom:12px;min-height:46px;" onclick="copyYesterdayCrew()"><span data-t="sameCrew"></span></button>
    <div class="card">
      <div class="card-title" data-t="presAddTitle"></div>
      <div class="form-group"><input id="pres-name" type="text" data-tp="presNamePh" list="pres-name-suggest" oninput="presNameChanged()" autocomplete="off"><datalist id="pres-name-suggest"></datalist></div>
      <div style="display:grid;grid-template-columns:1fr 120px;gap:10px;">
        <div class="form-group"><input id="pres-trade" type="text" data-tp="presTradePh" list="pres-trade-suggest" autocomplete="off"><datalist id="pres-trade-suggest"></datalist></div>
        <div class="form-group"><input id="pres-time" type="time" value="07:00" title="שעת כניסה"></div>
      </div>
      <button class="btn btn-blue" onclick="addPresence()"><span data-t="presAddBtn"></span></button>
    </div>
    <div class="card">
      <div class="card-title" data-t="presListTitle"></div>
      <div id="pres-list"></div>
    </div>
    <button class="btn btn-green" onclick="sharePresenceWA()"><span data-t="presShare"></span></button>
  </div>
</div>

<!-- PRESENCE HISTORY -->
<div class="screen" id="s-presence-history">
  <div class="topbar">
    <button class="back-btn" onclick="goBack()">→ <span data-t="backLabel"></span></button>
    <div class="topbar-center"><div class="topbar-title" data-t="presHistTitle"></div></div>
    <div style="width:40px"></div>
  </div>
  <div class="screen-body"><div id="pres-history-list"></div></div>
</div>

<!-- REMINDERS (#14) -->
<div class="screen" id="s-reminders">
  <div class="topbar">
    <button class="back-btn" onclick="showScreen('s-home')">→ <span data-t="backLabel"></span></button>
    <div class="topbar-center"><div class="topbar-title" data-t="remTitle"></div></div>
    <div style="width:40px"></div>
  </div>
  <div class="screen-body">
    <div class="card">
      <div class="card-title">🔔 <span data-t="remSmartTitle"></span></div>
      <div id="rem-smart"></div>
    </div>
    <div class="card">
      <div class="card-title">📝 <span data-t="remMyTitle"></span></div>
      <div class="form-group" style="display:flex;gap:8px;">
        <input id="rem-text" type="text" data-tp="remPlaceholder" style="flex:1;">
        <input id="rem-date" type="date" style="width:140px;">
      </div>
      <button class="btn btn-blue" onclick="addReminder()"><span data-t="remAddBtn"></span></button>
      <div id="rem-list" style="margin-top:12px;"></div>
    </div>
  </div>
</div>

<!-- INCIDENTS (#17) -->
<div class="screen" id="s-incidents">
  <div class="topbar">
    <button class="back-btn" onclick="showScreen('s-home')">→ <span data-t="backLabel"></span></button>
    <div class="topbar-center"><div class="topbar-title" data-t="incTitle"></div></div>
    <button class="icon-btn" aria-label="היסטוריה / السجل" onclick="showScreen('s-incidents-history')">📂</button>
  </div>
  <div class="screen-body">
    <div class="card" style="background:#fdecea;border:1px solid #f5b7b1;">
      <div style="font-size:13px;color:var(--red);font-weight:700;" data-t="incHint"></div>
    </div>
    <div class="card">
      <div class="card-title" data-t="incType"></div>
      <div class="work-type-grid" id="inc-type-grid"></div>
    </div>
    <div class="card">
      <div class="card-title" data-t="incDescTitle"></div>
      <textarea id="inc-desc" data-tp="incDescPh" rows="4"></textarea>
    </div>
    <div class="card"><div class="card-title" data-t="incLocation"></div><input id="inc-location" type="text" data-tp="incLocationPh"></div>
    <div class="card"><div class="card-title" data-t="incInjured"></div><input id="inc-injured" type="text" data-tp="incInjuredPh"></div>
    <div class="card"><div class="card-title" data-t="incAction"></div><textarea id="inc-action" data-tp="incActionPh" rows="2"></textarea></div>
    <div class="card">
      <div class="card-title" data-t="incPhoto"></div>
      <div class="photos-grid" id="inc-photos-grid"></div>
      <input type="file" id="inc-photo-input" accept="image/*" multiple style="display:none" onchange="handleIncPhotos(event)">
    </div>
    <button class="btn btn-red" onclick="saveIncident()"><span data-t="incSave"></span></button>
  </div>
</div>

<!-- INCIDENTS HISTORY -->
<div class="screen" id="s-incidents-history">
  <div class="topbar">
    <button class="back-btn" onclick="goBack()">→ <span data-t="backLabel"></span></button>
    <div class="topbar-center"><div class="topbar-title" data-t="incHistTitle"></div></div>
    <div style="width:40px"></div>
  </div>
  <div class="screen-body"><div id="inc-history-list"></div></div>
</div>

<!-- FOREIGN WORKER ONBOARDING (#12) -->
<div class="screen" id="s-onboard">
  <div class="topbar">
    <button class="back-btn" onclick="showScreen('s-home')">→ <span data-t="backLabel"></span></button>
    <div class="topbar-center"><div class="topbar-title" data-t="obTitle"></div></div>
    <div style="width:40px"></div>
  </div>
  <div class="screen-body">
    <button class="btn btn-green" style="margin-bottom:14px;" onclick="showScreen('s-onboard-new')"><span data-t="obAddBtn"></span></button>
    <div class="card"><div class="card-title" data-t="obListTitle"></div><div id="ob-list"></div></div>
  </div>
</div>

<!-- ONBOARD — NEW WORKER -->
<div class="screen" id="s-onboard-new">
  <div class="topbar">
    <button class="back-btn" onclick="showScreen('s-onboard')">→ <span data-t="backLabel"></span></button>
    <div class="topbar-center"><div class="topbar-title" data-t="obNewTitle"></div></div>
    <div style="width:40px"></div>
  </div>
  <div class="screen-body">
    <div class="card"><div class="card-title" data-t="obTypeTitle"></div><div class="stage-chips" id="ob-type-chips"></div></div>
    <div class="card"><div class="card-title" data-t="obName"></div><input id="ob-name" type="text" data-tp="obNamePh"></div>
    <div class="card"><div class="card-title"><span id="ob-permit-title"></span></div><input id="ob-permit" type="text"></div>
    <div class="card">
      <div class="card-title"><span id="ob-permit-photo-title"></span></div>
      <div class="photos-grid" id="ob-photo-grid" style="grid-template-columns:1fr;"></div>
      <input type="file" id="ob-photo-input" accept="image/*" style="display:none" onchange="handleObPhoto(event)">
    </div>
    <div class="card">
      <div class="card-title">🪜 <span data-t="obHeightTitle"></span></div>
      <div style="font-size:12px;color:var(--sub);margin-bottom:8px;" data-t="obHeightHint"></div>
      <div class="photos-grid" id="ob-height-grid" style="grid-template-columns:1fr;"></div>
      <input type="file" id="ob-height-input" accept="image/*" style="display:none" onchange="handleObHeightPhoto(event)">
      <label class="card-title" style="font-size:13px;margin-top:10px;color:var(--sub);" data-t="obHeightExp"></label>
      <input id="ob-height-exp" type="date">
    </div>
    <div class="card" id="ob-lang-card">
      <div class="card-title" data-t="obLang"></div>
      <div class="stage-chips" id="ob-lang-chips"></div>
    </div>
    <div class="card" style="background:#fff8e8;border:1px solid var(--accent);">
      <div class="card-title">🦺 <span data-t="obBriefTitle"></span></div>
      <div id="ob-brief" style="font-size:15px;line-height:1.8;white-space:pre-wrap;"></div>
    </div>
    <div class="card">
      <div class="card-title" data-t="obSignTitle"></div>

function _freeSpace(){
  // פינוי מקום: הסרת תמונות base64 כבדות מרשומות (נשמרות/יישמרו בענן) כדי לא לאבד נתונים חדשים
  var colls=['sb_journals','sb_defects','sb_safety','dk_incidents'];var freed=false;
  colls.forEach(function(kk){try{
    var list=JSON.parse(localStorage.getItem(kk)||'[]');var ch=false;
    // רוקן base64 רק מרשומות שכבר עלו לענן (photoUrls) — אחרת זו המחיקה היחידה והראיה תאבד
    for(var i=0;i<list.length;i++){var r=list[i];if(r&&r.photos&&r.photos.length&&r.photoUrls&&r.photoUrls.length){r.photos=[];r._photosOffloaded=true;ch=true;freed=true;}}
    if(ch)localStorage.setItem(kk,JSON.stringify(list));
  }catch(e){}});
  return freed;
}
function saveJSON(k,v){

  try{var raw=localStorage.getItem(k);if(raw&&!localStorage.getItem(k+'_corrupt'))localStorage.setItem(k+'_corrupt',raw);}catch(_){}
  try{toast(APP.lang==='ar'?'⚠️ بيانات تالفة — تم حفظ نسخة احتياطية':'⚠️ נתונים פגומים — נשמר גיבוי',6000);}catch(_){}

// מראה רשומה ל-Firebase (ללא תמונות כבדות — אלו יעברו ל-Storage בהמשך). חתימות נשמרות.
// מיפוי שם-אוסף-ענן → מפתח localStorage (כדי לעדכן את הרשומה המקומית עם כתובות הענן)
var DK_COLL_KEY={journals:'sb_journals',defects:'sb_defects',safety:'sb_safety',incidents:'dk_incidents',onboard:'dk_onboard',permits:'dk_permits'};
// שומר את כתובות התמונות בענן על הרשומה המקומית — כך שכשמפנים מקום (_freeSpace), עדיין אפשר להציג מהענן
function _dkStorePhotoUrls(coll,entryId,urls){
  var key=DK_COLL_KEY[coll];if(!key||!urls||!urls.length)return;
  try{var list=loadJSON(key,[]);var ch=false;for(var i=0;i<list.length;i++){if(list[i]&&list[i].id===entryId){list[i].photoUrls=urls;ch=true;break;}}if(ch)saveJSON(key,list);}catch(e){}
}
// תור סנכרון — רשומות שנשמרו בלי קליטה (לפי הפניה, בלי לשכפל תמונות base64); נשלחות כשחוזרת רשת
function _dkEnqueueSync(coll,id){
  if(!coll||!id||!DK_COLL_KEY[coll])return;
  try{var q=loadJSON('dk_sync_queue',[]);if(!q.some(function(x){return x.coll===coll&&x.id===id;})){q.push({coll:coll,id:id});saveJSON('dk_sync_queue',q);}}catch(e){}
}
function _dkFlushSync(){
  if(navigator.onLine===false||!window._dkSaveDoc)return;
  if(APP._dkFlushing)return;APP._dkFlushing=true;            // מנע flush מקבילים (אירוע online כפול) → כתיבות כפולות
  var q;try{q=loadJSON('dk_sync_queue',[]);}catch(e){APP._dkFlushing=false;return;}
  if(!q||!q.length){APP._dkFlushing=false;return;}
  var inflight=q.slice();
  var jobs=inflight.map(function(item){
    var key=DK_COLL_KEY[item.coll];
    var rec=key?loadJSON(key,[]).find(function(r){return r&&r.id===item.id;}):null;
    if(!rec)return Promise.resolve(true);                    // נמחק מקומית → הסר מהתור
    return cloudSave(item.coll,rec).then(function(r){return r!==false;},function(){return false;});
  });
  Promise.all(jobs).then(function(oks){
    var failed=[],sent=0;
    inflight.forEach(function(item,i){if(oks[i])sent++;else failed.push(item);}); // השאר בתור רק מה שנכשל (כולל כשל העלאת תמונות)
    var merged=failed.slice();                               // מזג פריטים חדשים שנכנסו לתור בזמן ה-flush
    try{loadJSON('dk_sync_queue',[]).forEach(function(x){
      var wasInflight=inflight.some(function(y){return y.coll===x.coll&&y.id===x.id;});
      var already=merged.some(function(y){return y.coll===x.coll&&y.id===x.id;});
      if(!wasInflight&&!already)merged.push(x);
    });}catch(e){}
    saveJSON('dk_sync_queue',merged);
    APP._dkFlushing=false;
    if(sent)try{toast(T('syncedToast'),2500);}catch(e){}
  },function(){APP._dkFlushing=false;});
}
function cloudSave(coll,entry){
  if(!entry)return Promise.resolve(false);
  // אין קליטה / Firebase עדיין לא מוכן → לתור, יישלח כשחוזרת רשת (בלי לאבד, בלי ✅ כוזב)
  if(navigator.onLine===false||!window._dkSaveDoc){_dkEnqueueSync(coll,entry.id);return Promise.resolve(false);}
  if(!window._dkSaveDoc)return Promise.resolve(false);
  var s=APP.settings||{};var owner=(s.managerPhone||'').replace(/\D/g,'');
  var docId=(owner||'x')+'_'+entry.id;
  // השמט שדות base64 כבדים מהמסמך בענן (מגבלת 1MB ל-doc): מערך photos, וכן שדות photo/*Photo (כלים)
  var copy={};for(var k in entry){if(k==='photos'||k==='photo'||/Photo$/.test(k))continue;copy[k]=entry[k];}
  if(entry.photos)copy.photoCount=entry.photos.length;
  copy.owner=owner;copy.ownerName=s.managerName||'';copy.project=s.projectName||'';
  copy.cloudAt=new Date().toISOString();
  try{window._dkSaveDoc(coll,docId,copy);}catch(e){}
  // העלאת תמונות ל-Storage (אסינכרוני) ועדכון הכתובות במסמך ובמקומי. מחזיר Promise כדי שמיגרציה תדע מתי באמת הסתיים.
  if(entry.photos&&entry.photos.length&&window._dkUploadPhotos){
    try{return window._dkUploadPhotos('photos/'+(owner||'x')+'/'+coll+'/'+entry.id,entry.photos).then(function(urls){
      if(urls&&urls.length){window._dkSaveDoc(coll,docId,{photoUrls:urls});_dkStorePhotoUrls(coll,entry.id,urls);}
      return true;
    });}catch(e){return Promise.reject(e);}
  }
  return Promise.resolve(true);
}
// מחזיר את התמונות להצגה: base64 מקומי אם קיים, אחרת כתובות הענן (אחרי פינוי מקום)
function dkPhotosOf(entry){return (entry&&entry.photos&&entry.photos.length)?entry.photos:((entry&&entry.photoUrls)||[]);}
function cloudDelete(coll,entry){
  if(!window._dkDeleteDoc||!entry)return;
  var owner=((APP.settings&&APP.settings.managerPhone)||'').replace(/\D/g,'');
  try{window._dkDeleteDoc(coll,(owner||'x')+'_'+entry.id);}catch(e){}
}
// מיגרציה חד-פעמית: העלאת תמונות ישנות (base64 מקומי) ל-Storage — שכלום מהעבר לא יאבד
window._dkMigratePhotos=function(){
  if(!window._dkUploadPhotos)return;                 // Storage לא מוכן
  if(loadJSON('dk_photo_migrated',false))return;     // כבר בוצע
  var sets=[['journals','sb_journals'],['defects','sb_defects'],['incidents','dk_incidents']];
  var count=0;var jobs=[];
  sets.forEach(function(p){
    var list=loadJSON(p[1],[]);
    list.forEach(function(e){ if(e&&e.photos&&e.photos.length&&!e.photoUrls){count++;try{jobs.push(Promise.resolve(cloudSave(p[0],e)));}catch(x){jobs.push(Promise.reject(x));}} });
  });
  if(!count){saveJSON('dk_photo_migrated',true);return;}
  toast((APP.lang==='ar'?'يتم رفع ':'מעלה ')+count+(APP.lang==='ar'?' صور سابقة للسحابة':' תמונות ישנות לענן'),3500);
  // סמן "בוצע" רק אם כל ההעלאות הצליחו — אחרת ינוסה שוב בהפעלה הבאה
  Promise.all(jobs).then(function(){saveJSON('dk_photo_migrated',true);}).catch(function(){/* יישאר לא-מסומן → ניסיון חוזר */});
};
// ניקוי מקום: מסיר base64 כבד מרשומות *ישנות* שכבר יש להן photoUrls בענן.
// שומר את ה-15 האחרונות בכל אוסף עם base64 לצפייה לא-מקוונת. רץ בהפעלה אחרי שה-Storage מוכן.
function _dkTrimPhotos(){
  var KEEP=15;var sets=['sb_journals','sb_defects','sb_safety','dk_incidents'];var freed=0;
  sets.forEach(function(key){
    try{
      var list=loadJSON(key,[]);var ch=false;
      for(var i=0;i<list.length;i++){
        var r=list[i];
        // i<KEEP = מהחדשות (list ב-unshift, כלומר החדש בראש) → לשמור base64
        if(i>=KEEP && r && r.photos && r.photos.length && r.photoUrls && r.photoUrls.length){
          r.photos=[];r._photosOffloaded=true;ch=true;freed++;
        }
      }
      if(ch)saveJSON(key,list);
    }catch(e){}
  });
  return freed;
}

// השלמה אוטומטית: אוסף שמות+מקצועות מ-60 הימים האחרונים ומהעובדים שנקלטו → מקפיץ שם קיים
var _presKnown={};
function buildPresSuggest(){
  var names={},trades={};_presKnown={};
  for(var i=0;i<60;i++){var d=new Date();d.setDate(d.getDate()-i);var l=loadJSON('pres_'+isoDate(d),null);if(l)l.forEach(function(p){if(p.name){names[p.name]=1;if(p.trade&&!_presKnown[p.name])_presKnown[p.name]=p.trade;}if(p.trade)trades[p.trade]=1;});}
  try{getOnboarded().forEach(function(o){if(o.name)names[o.name]=1;});}catch(e){}
  var nd=document.getElementById('pres-name-suggest');if(nd)nd.innerHTML=Object.keys(names).map(function(n){return '<option value="'+esc(n)+'"></option>';}).join('');
  var td=document.getElementById('pres-trade-suggest');if(td)td.innerHTML=Object.keys(trades).map(function(t){return '<option value="'+esc(t)+'"></option>';}).join('');
}
// כשבוחרים שם קיים — משלים אוטומטית את המקצוע הידוע (אם השדה ריק)
function presNameChanged(){var n=(document.getElementById('pres-name').value||'').trim();var tr=document.getElementById('pres-trade');if(tr&&!tr.value&&_presKnown[n])tr.value=_presKnown[n];}
// שעת הכניסה מהשדה (ברירת מחדל 07:00) → timestamp של היום
function presInTimestamp(){
  var t=(document.getElementById('pres-time')||{}).value||'07:00';
  var p=t.split(':');var d=new Date();d.setHours(parseInt(p[0])||7,parseInt(p[1])||0,0,0);
  return d.getTime();
}
function addPresence(){
  var name=document.getElementById('pres-name').value.trim();
  if(!name){toast(APP.lang==='ar'?'أدخل اسم العامل':'יש להזין שם עובד');return;}
  var list=getPresenceToday();
  list.unshift({id:Date.now(),name:name,trade:document.getElementById('pres-trade').value.trim(),inTs:presInTimestamp(),outTs:null});
  if(!saveJSON(presKey(),list)){toast(T('saveFailFull'),6000);return;}
  document.getElementById('pres-name').value='';document.getElementById('pres-trade').value='';
  cloudSavePresence();renderPresence();
  var nm=document.getElementById('pres-name');if(nm)nm.focus();
}
// אותו צוות כמו אתמול — מאתר את יום הנוכחות האחרון ומעתיק את השמות (כניסה לפי השעה שבשדה)
function copyYesterdayCrew(){
  var prev=null;
  for(var i=1;i<=14&&!prev;i++){var d=new Date();d.setDate(d.getDate()-i);var l=loadJSON('pres_'+isoDate(d),null);if(l&&l.length)prev=l;}
  if(!prev){toast(T('noPrevCrew'));return;}
  var list=getPresenceToday();var baseTs=presInTimestamp();var added=0;
  prev.forEach(function(p,idx){
    if(list.some(function(x){return x.name===p.name;}))return; // לא לשכפל מי שכבר נכנס
    list.push({id:Date.now()+idx,name:p.name,trade:p.trade||'',inTs:baseTs,outTs:null});added++;
  });
  if(!saveJSON(presKey(),list)){toast(T('saveFailFull'),6000);return;}
  cloudSavePresence();renderPresence();
  toast('👥 +'+added,2000);
}
// עריכה מהירה של שעת כניסה — הקשה על השעה ברשימה
function editPresTime(id){
  var list=getPresenceToday();var p=list.find(function(x){return x.id===id;});if(!p)return;
  function apply(h,mi){var d=new Date(p.inTs);d.setHours(h,mi,0,0);p.inTs=d.getTime();if(!saveJSON(presKey(),list)){toast(T('saveFailFull'),6000);return;}cloudSavePresence();renderPresence();}
  var d0=new Date(p.inTs);var cur=('0'+d0.getHours()).slice(-2)+':'+('0'+d0.getMinutes()).slice(-2);
  // בורר שעה נייטיב (נוח בשטח); נפילה ל-prompt בדפדפנים ישנים
  var inp=document.createElement('input');inp.type='time';
  if(inp.type==='time'&&typeof inp.showPicker==='function'){
    inp.value=cur;inp.style.cssText='position:fixed;left:-9999px;opacity:0;';document.body.appendChild(inp);
    inp.onchange=function(){var m=(inp.value||'').match(/^(\d{1,2}):(\d{2})$/);if(m)apply(parseInt(m[1]),parseInt(m[2]));try{document.body.removeChild(inp);}catch(e){}};
    try{inp.showPicker();}catch(e){try{document.body.removeChild(inp);}catch(_){} var nv=prompt(T('presInTime'),cur);var mm=nv&&nv.match(/^(\d{1,2}):?(\d{2})$/);if(mm)apply(parseInt(mm[1]),parseInt(mm[2]));}
  } else {
    var nv=prompt(T('presInTime'),cur);if(!nv)return;var m=nv.match(/^(\d{1,2}):?(\d{2})$/);if(!m){toast('07:30 ←');return;}apply(parseInt(m[1]),parseInt(m[2]));
  }
}
function presOut(id){

  if(!saveJSON(presKey(),list)){toast(T('saveFailFull'),6000);return;}
  cloudSavePresence();renderPresence();
}
function delPresence(id){var all=getPresenceToday();var p=all.find(function(x){return x.id===id;});if(!p)return;if(!confirm((APP.lang==='ar'?'حذف ':'למחוק את ')+(p.name||'')+'?'))return;var list=all.filter(function(x){return x.id!==id;});if(!saveJSON(presKey(),list)){toast(T('saveFailFull'),6000);return;}cloudSavePresence();renderPresence();toast(T('deleted'));}

function getReminders(){return loadJSON('dk_reminders',[]);}
function getSmartAlerts(){
  var alerts=[];
  var defs=loadJSON('sb_defects',[]);var today=isoDate();
  defs.forEach(function(d){if(d.status!=='done'&&d.deadline&&d.deadline<today)alerts.push({icon:'⚠️',text:T('remOverdue')+(d.desc||'').slice(0,40)});});
  var safety=loadJSON('sb_safety',[]);var hasToday=safety.some(function(r){return (r.date||'').slice(0,10)===today;});
  if(isFeatureOn('modSafety')&&!hasToday)alerts.push({icon:'🦺',text:T('remSafetyToday')});
  var journals=loadJSON('sb_journals',[]);
  if(journals[0]&&journals[0].tasks)alerts.push({icon:'📋',text:T('remTasksTomorrow')+journals[0].tasks.slice(0,50)});
  // תפוגת תאריכים — התראה דו-שלבית (חודש לפני, ושוב כשבועיים לפני אם לא טופל) בכל מקום שיש תאריך סיום:
  // כלים (רישיון כלי/נהג/ביטוח), אישור עבודה בגובה בקליטת עובד, והיתרי עבודה.
  if(isFeatureOn('modEquipment')){
    getEquipment().forEach(function(e){
      var nm=eqDisplayType(e)+(e.name?' ('+e.name+')':'');
      [['toolLicenseExp','eqToolLic'],['driverLicenseExp','eqDriverLic'],['insuranceExp','eqInsurance']].forEach(function(p){
        var a=expAlert(nm+' — '+T(p[1]),e[p[0]]);if(a)alerts.push(a);
      });
    });
  }
  if(isFeatureOn('modOnboard')){
    getOnboarded().forEach(function(o){if(o.heightExp){var a=expAlert((o.name||'')+' — '+T('obHeightShort'),o.heightExp);if(a)alerts.push(a);}});
  }
  if(isFeatureOn('modPermits')){
    getPermits().forEach(function(pm){if(pm.validUntil){var a=expAlert(permLabel(pm.type)+(pm.worker?' ('+pm.worker+')':''),pm.validUntil);if(a)alerts.push(a);}});
  }
  return alerts;
}

// דחיסת תמונה לפני שמירה ל-localStorage (מונע חריגת מכסה ~5MB): max 1000px, JPEG 0.6
function dkCompressImage(dataUrl,cb){
  try{var img=new Image();
    img.onload=function(){var max=1000,w=img.width,h=img.height;
      if(w>max||h>max){if(w>=h){h=Math.round(h*max/w);w=max;}else{w=Math.round(w*max/h);h=max;}}
      try{var c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);cb(c.toDataURL('image/jpeg',0.6));}catch(e){cb(dataUrl);}};
    img.onerror=function(){cb(dataUrl);};img.src=dataUrl;
  }catch(e){cb(dataUrl);}
}

function renderContractorScores(){
  var el=document.getElementById('con-list');if(!el)return;
  var defs=loadJSON('sb_defects',[]);
  var contractors=(APP.settings&&APP.settings.contractors)||[];
  // אסוף שמות קבלנים: מההגדרות + מתוך הליקויים
  var names={};contractors.forEach(function(c){names[c.name]={name:c.name,trade:c.trade||'',phone:c.phone||''};});
  defs.forEach(function(d){if(d.contractor&&!names[d.contractor])names[d.contractor]={name:d.contractor,trade:'',phone:d.contractorPhone||''};});
  var arr=Object.keys(names).map(function(k){return names[k];});
  if(!arr.length){el.innerHTML='<div style="text-align:center;padding:30px;color:var(--sub);">'+T('conEmpty')+'</div>';return;}
  var h='';
  arr.forEach(function(c){
    var mine=defs.filter(function(d){return d.contractor===c.name;});
    var open=mine.filter(function(d){return d.status!=='done';}).length;
    var done=mine.filter(function(d){return d.status==='done';});
    // זמן תיקון ממוצע (ימים) — מתאריך פתיחה ל-fix.when
    var sum=0,cnt=0;done.forEach(function(d){if(d.fix&&d.fix.when&&d.date){var diff=(new Date(d.fix.when)-new Date(d.date))/86400000;if(diff>=0){sum+=diff;cnt++;}}});
    var avg=cnt?(sum/cnt):null;
    // דירוג: פחות פתוחים + תיקון מהיר = יותר כוכבים
    var stars=5;if(open>=5)stars-=2;else if(open>=2)stars-=1;if(avg!==null&&avg>5)stars-=2;else if(avg!==null&&avg>2)stars-=1;if(stars<1)stars=1;
    var starStr='';for(var i=0;i<5;i++)starStr+=i<stars?'⭐':'☆';
    h+='<div class="card">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;"><div><span style="font-weight:800;font-size:16px;">'+esc(c.name)+'</span>'+(c.trade?' <span style="font-size:12px;color:var(--orange);background:#fef3e7;padding:2px 8px;border-radius:10px;">'+esc(c.trade)+'</span>':'')+'</div>'+(mine.length?'<span style="font-size:14px;">'+starStr+'</span>':'')+'</div>'
      +'<div style="display:flex;gap:8px;flex-wrap:wrap;font-size:13px;">'
      +'<span style="background:#fdecea;color:var(--red);padding:5px 10px;border-radius:8px;font-weight:700;">'+T('conOpen')+': '+open+'</span>'
      +'<span style="background:#eafaf1;color:var(--green);padding:5px 10px;border-radius:8px;font-weight:700;">'+T('conDone')+': '+done.length+'</span>'
      +(avg!==null?'<span style="background:var(--bg);padding:5px 10px;border-radius:8px;font-weight:700;">'+T('conAvg')+': '+avg.toFixed(1)+' '+T('conDays')+'</span>':'')
      +'</div>'
      +(c.phone?'<button class="btn btn-gray btn-sm" style="margin-top:10px;" onclick="openWhatsApp(\''+String(c.phone).replace(/[^0-9+]/g,'')+'\',\'\')">'+T('btnWA')+'</button>':'')
      +'</div>';
  });
  el.innerHTML=h;
}

// סטטוס תפוגה: none/ok/soon(≤30 יום)/expired — לפי תאריך מקומי
// ===== תאריכי תפוגה — מנגנון התראה דו-שלבי משותף (רישיון/היתר/ביטוח) =====
// ימים שנותרו עד התפוגה (תומך ב-YYYY-MM-DD וב-datetime-local YYYY-MM-DDTHH:mm)
function expDaysLeft(dateStr){if(!dateStr)return null;try{var t=new Date();t.setHours(0,0,0,0);var d=new Date((''+dateStr).slice(0,10)+'T00:00:00');if(isNaN(d.getTime()))return null;return Math.round((d.getTime()-t.getTime())/86400000);}catch(e){return null;}}
// שלב התראה: none/ok / alert1 (≤חודש) / alert2 (≤שבועיים — "התראה שנייה") / expired
function expStage(dateStr){var n=expDaysLeft(dateStr);if(n===null)return 'none';if(n<0)return 'expired';if(n<=14)return 'alert2';if(n<=30)return 'alert1';return 'ok';}
// בונה הודעת התראה דו-לשונית: חודש לפני (🔔), שוב בשבועיים האחרונים אם לא טופל (⚠️), ופג (🔴). null אם רחוק/אין תאריך.
function expAlert(label,dateStr){
  var st=expStage(dateStr);if(st==='none'||st==='ok')return null;
  var n=expDaysLeft(dateStr),ar=APP.lang==='ar',d=(''+dateStr).slice(0,10);
  if(st==='expired')return {icon:'🔴',text:(ar?'انتهت الصلاحية: ':'פג תוקף: ')+label+' ('+d+')'};
  if(st==='alert2'){var soonTxt=ar?(n===0?'تنتهي اليوم ولم تُعالَج بعد':'تذكير ثانٍ: تنتهي خلال '+n+' يوم ولم تُعالَج بعد'):(n===0?'פג היום וטרם טופל':'תזכורת שנייה: פג בעוד '+n+' ימים וטרם טופל');return {icon:'⚠️',text:label+' — '+soonTxt+' ('+d+')'};}
  return {icon:'🔔',text:label+' — '+(ar?'تنتهي خلال شهر تقريباً':'פג בעוד כחודש')+' ('+d+')'};
}
function eqExpStatus(dateStr){var s=expStage(dateStr);return (s==='alert1'||s==='alert2')?'soon':s;}
function eqWorstStatus(e){var a=[eqExpStatus(e.toolLicenseExp),eqExpStatus(e.driverLicenseExp),eqExpStatus(e.insuranceExp)];if(a.indexOf('expired')>=0)return 'expired';if(a.indexOf('soon')>=0)return 'soon';return 'ok';}

// ===== עזר חתימה גנרי (שימוש חוזר לכמה קנבסים) =====
function attachSignPad(canvas){
  if(!canvas)return null;
  var ctx=canvas.getContext('2d');canvas.width=canvas.offsetWidth||400;canvas.height=110;ctx.clearRect(0,0,canvas.width,canvas.height);
  var drawing=false,dirty=false;
  function pos(e){var r=canvas.getBoundingClientRect();var pt=e.touches?e.touches[0]:e;return{x:pt.clientX-r.left,y:pt.clientY-r.top};}
  function down(e){if(e.preventDefault)e.preventDefault();drawing=true;dirty=true;var p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);}
  function move(e){if(!drawing)return;if(e.preventDefault)e.preventDefault();var p=pos(e);ctx.lineTo(p.x,p.y);ctx.strokeStyle='#222';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.stroke();}
  function up(){drawing=false;}
  canvas.onmousedown=down;canvas.onmousemove=move;canvas.onmouseup=up;canvas.onmouseleave=up;
  canvas.addEventListener('touchstart',down,{passive:false});canvas.addEventListener('touchmove',move,{passive:false});canvas.addEventListener('touchend',up);
  return {clear:function(){ctx.clearRect(0,0,canvas.width,canvas.height);dirty=false;},isEmpty:function(){return !dirty;},dataURL:function(){return dirty?canvas.toDataURL('image/png'):'';}};
}

// שליחה אחידה לוואטסאפ — ישר לאפליקציה בטלפון (deep link), לא חלון דפדפן חדש
function openWhatsApp(phone,text){
  var p=(phone||'').replace(/\D/g,'');
  if(p&&p.charAt(0)==='0')p='972'+p.slice(1);            // המרה לפורמט בינלאומי
  else if(p&&p.indexOf('972')!==0&&p.length<=10)p='972'+p;
  var enc=encodeURIComponent(text);
  var isMobile=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent||'');
  if(isMobile){
    // פתיחה ישירה של אפליקציית וואטסאפ — אותו חלון, ללא טאב דפדפן
    window.location.href='whatsapp://send?'+(p?'phone='+p+'&':'')+'text='+enc;
  } else {
    // דסקטופ — וואטסאפ ווב בטאב חדש
    window.open('https://wa.me/'+(p||'')+'?text='+enc,'_blank');
  }
}

function sendDailyDigest(){
  var s=APP.settings,ar=APP.lang==='ar',today=isoDate(),line='━━━━━━━━━━━━━━━',any=false;
  var todayHuman=new Date().toLocaleDateString(ar?'ar-IL':'he-IL',{weekday:'long',day:'numeric',month:'long'});
  var msg='📤 *'+(ar?'ملخص يومي':'סיכום יום')+'*\n'+line+'\n';
  msg+='🏗️ *'+(s.projectName||'')+'*\n📅 '+todayHuman+'\n';
  msg+='👷 '+(ar?'مدير العمل':'מנהל עבודה')+': '+(s.managerName||'')+'\n'+line+'\n';
  // נוכחות עובדים
  var pres=getPresenceToday();
  if(pres.length){any=true;var present=pres.filter(function(p){return !p.outTs;}).length;
    msg+='👥 *'+(ar?'الحضور':'נוכחות')+':* '+pres.length+' '+(ar?'عامل':'עובדים')+' ('+(ar?'في الموقع':'באתר')+': '+present+')\n';}
  // יומן עבודה
  var jToday=loadJSON('sb_journals',[]).filter(function(j){return dkLocalDay(j.date)===today;});
  if(jToday.length){any=true;var j=jToday[0],tot=0;if(j.workers)j.workers.forEach(function(w){tot+=w.qty;});
    msg+='📋 *'+(ar?'يومية عمل':'יומן עבודה')+':* '+(ar?'تم التوثيق':'תועד')+(tot?' · '+tot+' '+(ar?'عامل':'עובדים'):'')+'\n';
    if(j.delays)msg+='   ⚠️ '+(ar?'تأخيرات':'עיכובים')+': '+j.delays+'\n';
  } else { msg+='📋 *'+(ar?'يومية عمل':'יומן עבודה')+':* '+(ar?'لم تُسجَّل بعد ⚠️':'טרם נרשם ⚠️')+'\n'; }
  // בטיחות
  var sToday=loadJSON('sb_safety',[]).filter(function(r){return dkLocalDay(r.date)===today;});
  if(sToday.length){any=true;var r=sToday[0],fails=0;for(var k in r.answers){if(r.answers[k]==='fail')fails++;}
    msg+='🦺 *'+(ar?'فحص السلامة':'בדיקת בטיחות')+':* '+(fails?('🔴 '+fails+' '+(ar?'ليقوي':'ליקויים')):('🟢 '+(ar?'سليم':'תקין')))+'\n';
  } else { msg+='🦺 *'+(ar?'فحص السلامة':'בדיקת בטיחות')+':* '+(ar?'لم يُجرَ بعد ⚠️':'טרם בוצעה ⚠️')+'\n'; }
  // ליקויים
  var defects=loadJSON('sb_defects',[]);
  var openDef=defects.filter(function(d){return d.status!=='done';});
  var newToday=defects.filter(function(d){return dkLocalDay(d.date)===today;}).length;
  var fixedToday=defects.filter(function(d){return d.status==='done'&&d.fix&&(d.fix.when||'').slice(0,10)===today;}).length;
  msg+='📸 *'+(ar?'العيوب':'ליקויים')+':* '+(ar?'مفتوح':'פתוחים')+' '+openDef.length;
  if(newToday)msg+=' · '+(ar?'جديد اليوم':'חדשים היום')+' '+newToday;
  if(fixedToday)msg+=' · '+(ar?'عولج اليوم':'טופלו היום')+' '+fixedToday;
  msg+='\n';
  if(openDef.length||newToday)any=true;
  var urgent=openDef.filter(function(d){return d.severity==='urgent';});
  if(urgent.length){msg+='   🔴 '+(ar?'عاجل':'דחוף')+':\n';
    urgent.slice(0,5).forEach(function(d){msg+='   • '+(d.desc||'')+(d.floor?' ('+d.floor+')':'')+'\n';});
    if(urgent.length>5)msg+='   • +'+(urgent.length-5)+'\n';}
  msg+=line+'\n_'+(ar?'أُرسل عبر تطبيق SiteBoss':'נשלח מאפליקציית SiteBoss')+'_';
  if(!any){toast(T('digestEmpty'),3500);return;}
  openOfficeWA(msg);
}

var WORK_TYPES=[{k:'general',i:'🏗️',l:'wtGeneral'},{k:'structure',i:'🏛️',l:'wtStructure'},{k:'finishing',i:'🪟',l:'wtFinishing'},{k:'scaffolding',i:'🪜',l:'wtScaffolding'},{k:'excavation',i:'⛏️',l:'wtExcavation'}];

var signCanvas,signCtx,signing=false;
function initSignature(){
  signCanvas=document.getElementById('sign-canvas');if(!signCanvas)return;
  signCtx=signCanvas.getContext('2d');signCanvas.width=signCanvas.offsetWidth||400;signCanvas.height=110;
  signCtx.clearRect(0,0,signCanvas.width,signCanvas.height);
  signCanvas.onmousedown=function(e){signing=true;var p=sPos(e);signCtx.beginPath();signCtx.moveTo(p.x,p.y);};
  signCanvas.onmousemove=function(e){if(!signing)return;var p=sPos(e);signCtx.lineTo(p.x,p.y);signCtx.strokeStyle='#222';signCtx.lineWidth=2.5;signCtx.lineCap='round';signCtx.stroke();};
  signCanvas.onmouseup=function(){signing=false;};signCanvas.onmouseleave=function(){signing=false;};
  signCanvas.addEventListener('touchstart',function(e){e.preventDefault();signing=true;var t=e.touches[0];var r=signCanvas.getBoundingClientRect();signCtx.beginPath();signCtx.moveTo(t.clientX-r.left,t.clientY-r.top);},{passive:false});
  signCanvas.addEventListener('touchmove',function(e){e.preventDefault();if(!signing)return;var t=e.touches[0];var r=signCanvas.getBoundingClientRect();signCtx.lineTo(t.clientX-r.left,t.clientY-r.top);signCtx.strokeStyle='#222';signCtx.lineWidth=2.5;signCtx.lineCap='round';signCtx.stroke();},{passive:false});
  signCanvas.addEventListener('touchend',function(){signing=false;});

function sPos(e){var r=signCanvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}

function showSafetyReport(entryOrStr){

        if(fix.notes)h+='<div class="fix-row"><span class="fix-lbl">'+T('fixedNote')+'</span><span>'+esc(fix.notes)+'</span></div>';
        if(fix.photo)h+='<div style="margin-top:6px;"><img src="'+fix.photo+'" style="width:100%;max-height:120px;object-fit:cover;border-radius:8px;"></div>';

    }

// ייצוא CSV (נפתח באקסל) — UTF-8 BOM לעברית, ציטוט בטוח
function _csvCell(v){v=(v==null?'':String(v));if(/^[=+\-@\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"';}
function dkExportCSV(type){
  var rows=[],fname='';
  if(type==='defects'){
    var ds=loadJSON('sb_defects',[]);if(!ds.length){toast(T('exportEmpty'));return;}
    rows.push(['תאריך','תיאור','קומה','אגף','קבלן','חומרה','סטטוס','יעד','תוקן ע"י','זמן תיקון']);
    ds.forEach(function(d){rows.push([new Date(d.date||d.ts).toLocaleDateString('he-IL'),d.desc||'',d.floor||'',d.area||'',d.contractor||'',d.severity||'',d.status||'',d.deadline||'',(d.fix&&d.fix.by)||'',(d.fix&&d.fix.when)?new Date(d.fix.when).toLocaleString('he-IL'):'']);});
    fname='defects';
  } else {
    var js=loadJSON('sb_journals',[]);if(!js.length){toast(T('exportEmpty'));return;}
    rows.push(['תאריך','מס׳ יומן','סה"כ עובדים','מזג אוויר','תיאור','עיכובים','משימות למחר','אישור פיקוח']);
    js.forEach(function(j){var tw=0;if(j.workers)j.workers.forEach(function(w){tw+=(w.qty||0);});rows.push([new Date(j.date).toLocaleDateString('he-IL'),j.serial||'',tw,(j.weather>=0?T('wl'+j.weather):''),j.text||'',j.delays||'',j.tasks||'',j.supervisorApproval?'מאושר':'ממתין']);});
    fname='journals';
  }
  var csv='﻿'+rows.map(function(r){return r.map(_csvCell).join(',');}).join('\r\n');
  try{
    var blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
    var url=URL.createObjectURL(blob);var a=document.createElement('a');
    a.href=url;a.download='daka_'+fname+'_'+isoDate()+'.csv';document.body.appendChild(a);a.click();
    setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},1000);
    toast('⬇️ '+rows.length-1+' '+(APP.lang==='ar'?'سجل':'רשומות'));
  }catch(e){toast(T('exportEmpty'));}
}
function getGPS(){if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(function(p){APP.gps=p.coords.latitude.toFixed(5)+', '+p.coords.longitude.toFixed(5);},function(){},{timeout:10000});}
// ===================== SAFETY FIX =====================
var _sfReportId=null,_sfQuestionKey=null,_sfPhoto=null;
function openSafetyFix(reportId,questionKey){
  _sfReportId=reportId;_sfQuestionKey=questionKey;_sfPhoto=null;
  var safety=loadJSON('sb_safety',[]);
  var entry=safety.find(function(r){return r.id===reportId;});
  if(!entry)return;
  var prev=document.getElementById('safety-fix-q-preview');
  if(prev){
    var qText=T(questionKey);
    var fixEntry=entry.fixes&&entry.fixes[questionKey];
    var existing=fixEntry?('<div style="background:#d5f5e3;border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:12px;color:var(--green);">'+T('fixedLabel')+': '+esc(fixEntry.by)+'</div>'):'';
    prev.innerHTML='<div style="background:#fff3cd;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px;"><strong>'+esc(qText)+'</strong></div>'+existing;
  }
  var now=new Date();now.setMinutes(now.getMinutes()-now.getTimezoneOffset());
  document.getElementById('sf-when').value=now.toISOString().slice(0,16);
  document.getElementById('sf-by').value=APP.settings.managerName||'';
  document.getElementById('sf-notes').value='';
  document.getElementById('sf-photo-preview').innerHTML='';
  applyLang();
  openModal('modal-safety-fix');
}
function handleSafetyFixPhoto(input){
  var f=input.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(e){
    _sfPhoto=e.target.result;
    document.getElementById('sf-photo-preview').innerHTML='<div style="position:relative;display:inline-block;width:100%;"><img src="'+_sfPhoto+'" style="width:100%;max-height:160px;object-fit:cover;border-radius:8px;"><button onclick="_sfPhoto=null;document.getElementById(\'sf-photo-preview\').innerHTML=\'\'" style="position:absolute;top:6px;left:6px;background:rgba(231,76,60,.9);color:white;border:none;border-radius:50%;width:28px;height:28px;font-size:14px;cursor:pointer;">✕</button></div>';
  };
  r.readAsDataURL(f);input.value='';
}
function saveSafetyFix(){
  var by=document.getElementById('sf-by').value.trim();
  var when=document.getElementById('sf-when').value;
  var notes=document.getElementById('sf-notes').value.trim();
  if(!by){toast(APP.lang==='ar'?'يرجى إدخال اسم المُصلِح':'יש להזין מי ביצע את התיקון');return;}
  var safety=loadJSON('sb_safety',[]);
  for(var i=0;i<safety.length;i++){
    if(safety[i].id===_sfReportId){
      if(!safety[i].fixes)safety[i].fixes={};
      safety[i].fixes[_sfQuestionKey]={by:by,when:when,notes:notes,photo:_sfPhoto||null};
      break;
    }
  }
  saveJSON('sb_safety',safety);
  closeModal('modal-safety-fix');
  toast(T('fixedLabel')+' ✅');
  // רענן את הדוח המוצג
  var entry=safety.find(function(r){return r.id===_sfReportId;});
  if(entry)showSafetyReport(entry);
}

function setRegLang(lang){
  APP.lang=lang;
  document.getElementById('reglang-he').classList.toggle('active',lang==='he');
  document.getElementById('reglang-ar').classList.toggle('active',lang==='ar');
  applyLang();
}

function submitRegistration(){
  var name=document.getElementById('reg-name').value.trim();
  var phone=document.getElementById('reg-phone').value.trim();
  var company=document.getElementById('reg-company').value.trim();
  var project=document.getElementById('reg-project').value.trim();
  if(!name){toast(APP.lang==='ar'?'يرجى إدخال الاسم الكامل':'יש להזין שם מלא');document.getElementById('reg-name').focus();return;}
  if(!phone){toast(APP.lang==='ar'?'يرجى إدخال رقم الهاتف':'יש להזין מספר טלפון');document.getElementById('reg-phone').focus();return;}
  // נרמול טלפון לספרות בלבד — מונע חשבונות כפולים ("050-1" מול "0501") ו-docId לא-עקבי
  phone=phone.replace(/\D/g,'');
  if(phone.length<9){toast(APP.lang==='ar'?'رقم هاتف غير صحيح':'מספר טלפון לא תקין');document.getElementById('reg-phone').focus();return;}
  // שמור הגדרות
  APP.settings.managerName=name;
  APP.settings.managerPhone=phone;
  APP.settings.companyName=company;
  APP.settings.projectName=project;
  APP.settings.lang=APP.lang;
  APP.settings.registered=true;
  APP.settings.registeredAt=new Date().toISOString();
  saveJSON('sb_settings',APP.settings);
  // שליחה ל-Firebase (אם מחובר)
  if(window._dkRegister)try{window._dkRegister({name:name,phone:phone,company:company,project:project,lang:APP.lang,registeredAt:APP.settings.registeredAt});}catch(e){}
  toast((APP.lang==='ar'?'أهلاً ':' ברוך הבא ')+name+' 👋',3000);
  showScreen('s-home');
}

// כניסה/שחזור לפי מספר טלפון — מושך את הפרופיל מהענן (לדפדפן/מכשיר חדש)
function restoreByPhone(){
  var phone=document.getElementById('reg-phone').value.trim();
  if(!phone){toast(T('regRestoreNeedPhone'));document.getElementById('reg-phone').focus();return;}
  if(!window._dkFetchManager){toast(T('regRestoreNoNet'));return;}
  toast('...');
  window._dkFetchManager(phone).then(function(data){
    if(!data){toast(T('regRestoreNotFound'));return;}
    APP.settings.managerName=data.name||'';
    APP.settings.managerPhone=data.phone||phone;
    APP.settings.companyName=data.company||'';
    APP.settings.projectName=data.project||'';
    APP.settings.lang=data.lang||APP.lang;
    APP.settings.registered=true;
    APP.settings.registeredAt=data.registeredAt||new Date().toISOString();
    saveJSON('sb_settings',APP.settings);
    APP.lang=APP.settings.lang;
    if(data.features){APP.features=data.features;saveJSON('dk_features',APP.features);}
    applyLang();applyFeatures();
    toast(T('regRestoreOk')+(data.name||'')+' 👋',3000);
    showScreen('s-home');
  }).catch(function(){toast(T('regRestoreNoNet'));});
}

function isRegistered(){
  var s=loadJSON('sb_settings',{});
  // תואם גרסות ישנות: אם יש שם מנהל (גם בלי דגל registered) — נחשב רשום
  if(s&&s.managerName){
    if(!s.registered){s.registered=true;saveJSON('sb_settings',s);}
    return true;
  }
  return false;
}

// ===================== פיצ'רים מתקדמים (גילוי מדורג) =====================
// שכבה 1: זמינות נקבעת ע"י הבעלים (APP.features מה-Firebase). שכבה 2: המנהל בוחר להציג/להסתיר (APP.userPrefs).
// כל הפיצ'רים במערכת — def=ברירת מחדל זמינות (core דלוק, מתקדם כבוי)
var ALL_FEATURES=[
  {k:'modJournal',he:'יומן עבודה',ar:'يومية العمل',def:true},
  {k:'modDefects',he:'ליקויים ומשימות',ar:'العيوب والمهام',def:true},
  {k:'modSafety',he:'בטיחות יומית',ar:'السلامة اليومية',def:true},
  {k:'modPresence',he:'נוכחות עובדים',ar:'حضور العمال',def:false},
  {k:'modReminders',he:'תזכורות ומשימות',ar:'تذكيرات ومهام',def:false},
  {k:'modIncidents',he:'דיווח אירועים ותאונות',ar:'تبليغ الحوادث',def:false},
  {k:'modOnboard',he:'קליטת עובדים (זר/ישראלי)',ar:'استقبال العمال (أجنبي/إسرائيلي)',def:false},
  {k:'modContractors',he:'קבלני משנה',ar:'مقاولو الباطن',def:false},
  {k:'modPermits',he:'היתרי עבודה',ar:'تصاريح العمل',def:false},
  {k:'modEquipment',he:'כלים וציוד',ar:'المعدات والآليات',def:false},
  {k:'messages',he:'הודעות מהמשרד',ar:'رسائل المكتب',def:true},
  {k:'supervisorApproval',he:'אישור פיקוח ביומן',ar:'مصادقة المشرف',def:false},
  {k:'safetyStages',he:'שאלות בטיחות לפי שלב',ar:'أسئلة سلامة حسب المرحلة',def:false},
  {k:'customTrades',he:'הוספת מקצוע ביומן',ar:'إضافة مهنة',def:false}
];
function featDefault(k){for(var i=0;i<ALL_FEATURES.length;i++)if(ALL_FEATURES[i].k===k)return ALL_FEATURES[i].def;return false;}
function featAvailable(k){var f=APP.features||{};return (f[k]!==undefined)?!!f[k]:featDefault(k);} // זמינות (בעלים/ברירת מחדל)
function isFeatureOn(k){
  if(!featAvailable(k))return false;
  return (APP.userPrefs||{})[k]!==false;   // המנהל לא הסתיר
}
function applyFeatures(){
  var b=document.getElementById('btn-add-trade');if(b)b.style.display=isFeatureOn('customTrades')?'':'none';
  var hj=document.getElementById('home-mod-journal');if(hj)hj.style.display=isFeatureOn('modJournal')?'':'none';
  var hd=document.getElementById('home-mod-defects');if(hd)hd.style.display=isFeatureOn('modDefects')?'':'none';
  var hs=document.getElementById('home-mod-safety');if(hs)hs.style.display=isFeatureOn('modSafety')?'':'none';
  var hp=document.getElementById('home-mod-presence');if(hp)hp.style.display=isFeatureOn('modPresence')?'':'none';
  var hr=document.getElementById('home-mod-reminders');if(hr)hr.style.display=isFeatureOn('modReminders')?'':'none';
  var hi=document.getElementById('home-mod-incidents');if(hi)hi.style.display=isFeatureOn('modIncidents')?'':'none';
  var ho=document.getElementById('home-mod-onboard');if(ho)ho.style.display=isFeatureOn('modOnboard')?'':'none';
  var hc=document.getElementById('home-mod-contractors');if(hc)hc.style.display=isFeatureOn('modContractors')?'':'none';
  var hpm=document.getElementById('home-mod-permits');if(hpm)hpm.style.display=isFeatureOn('modPermits')?'':'none';
  var heq=document.getElementById('home-mod-equipment');if(heq)heq.style.display=isFeatureOn('modEquipment')?'':'none';
  if(typeof updateReminderBadge==='function')updateReminderBadge();
  updateMsgBanner();
  var act=document.querySelector('.screen.active');
  if(act&&act.id==='s-safety')renderSafetyQuestions();
}
window._dkOnFeatures=function(f){
  APP.features=f||{};
  saveJSON('dk_features',APP.features);applyFeatures();
  var act=document.querySelector('.screen.active');if(act&&act.id==='s-settings')renderFeaturePrefs();
};
function toggleUserPref(k,on){
  if(!APP.userPrefs)APP.userPrefs={};
  APP.userPrefs[k]=on;saveJSON('dk_user_prefs',APP.userPrefs);applyFeatures();
}
function renderFeaturePrefs(){
  var wrap=document.getElementById('feature-prefs');if(!wrap)return;
  // כל הפיצ'רים שזמינים למנהל (כולל מודולים) — שיוכל להסתיר מה שלא בשימוש
  var avail=ALL_FEATURES.filter(function(f){return featAvailable(f.k);});
  if(avail.length<=0){wrap.style.display='none';wrap.innerHTML='';return;}
  wrap.style.display='block';
  var h='<div class="card-title" style="margin-top:6px;">⭐ '+T('advFeaturesTitle')+'</div>';
  avail.forEach(function(f){
    h+='<label class="feat-toggle"><span>'+(APP.lang==='ar'?f.ar:f.he)+'</span>'
      +'<input type="checkbox" '+(isFeatureOn(f.k)?'checked':'')+' onchange="toggleUserPref(\''+f.k+'\',this.checked)"></label>';
  });
  wrap.innerHTML=h;
}

function injectLangToggles(){
  document.querySelectorAll('.topbar').forEach(function(tb){

    if(tb.lastElementChild)tb.insertBefore(d,tb.lastElementChild);else tb.appendChild(d);
  });
}
